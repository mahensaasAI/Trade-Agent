<!DOCTYPE html>
<html lang="en" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorkPlace — OraDayForce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e5e7eb;--line2:#d7dae1;--tx:#0f1218;--tx2:#5a6170;--tx3:#8b91a0;--ac:#4f46e5;--ac2:#7c6cf5;--acs:#eef0ff;--acl:#dcdefb;--ok:#0d8a5f;--oks:#e6f5ee;--warn:#b45309;--warns:#fdf2e2;--err:#c0392b;--errs:#fdeceb;--mut:#6b7280;--muts:#f0f1f4;--sh:0 1px 2px rgba(16,20,30,.05),0 1px 3px rgba(16,20,30,.05);--sh2:0 10px 30px rgba(16,20,30,.13);--r:10px}
[data-t="dark"]{--bg:#0b0d12;--panel:#14171e;--panel2:#191d25;--line:#242832;--line2:#333947;--tx:#e9ebf1;--tx2:#99a0b0;--tx3:#6c7383;--ac:#8079ff;--ac2:#a394ff;--acs:#1b1d33;--acl:#2e3057;--ok:#3fd699;--oks:#0f2a20;--warn:#f0b429;--warns:#2a2211;--err:#ff7070;--errs:#2d1618;--mut:#8b91a0;--muts:#1b1f27;--sh:0 1px 2px rgba(0,0,0,.45);--sh2:0 12px 34px rgba(0,0,0,.55)}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.ic{width:16px;height:16px;flex:none;display:block}.ic18{width:18px;height:18px}
.hide{display:none!important}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* LOGIN */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-l{display:flex;align-items:center;justify-content:center;padding:32px}
.login-r{background:linear-gradient(150deg,#1e1b4b,#4f46e5 60%,#7c6cf5);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login-r h2{font-size:26px;font-weight:680;letter-spacing:-.7px;line-height:1.25}
.login-r p{opacity:.86;font-size:14px;max-width:420px}
.login-r ul{list-style:none;display:grid;gap:11px;margin-top:8px}
.login-r li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;opacity:.94}
.login-box{width:min(400px,100%)}
.login-box h1{font-size:24px;font-weight:680;letter-spacing:-.6px;margin-bottom:5px}
.brandrow{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.logo{width:36px;height:36px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
/* SHELL */
.shell{display:flex;min-height:100vh;width:100%}
.sb{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .16s}
body[data-sb="mini"] .sb{width:66px}
.sb-top{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:-.25px;font-size:15px}
.brand span{color:var(--tx3);font-weight:500;font-size:11px;display:block;line-height:1.1}
.sb-nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.sb-lbl{font-size:10.5px;font-weight:650;letter-spacing:.7px;color:var(--tx3);padding:14px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--tx2);background:none;border:0;cursor:pointer;width:100%;text-align:left;font-weight:500;font-size:13.5px}
.nv:hover{background:var(--muts);color:var(--tx)}
.nv.on{background:var(--acs);color:var(--ac);font-weight:600}
.nv .cnt{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:600}
body[data-sb="mini"] .nv-t,body[data-sb="mini"] .sb-lbl,body[data-sb="mini"] .brand,body[data-sb="mini"] .nv .cnt,body[data-sb="mini"] .u-meta{display:none}
body[data-sb="mini"] .nv{justify-content:center;padding:9px 0}
.sb-bot{border-top:1px solid var(--line);padding:10px;display:grid;gap:4px}
.u-row{display:flex;align-items:center;gap:10px;padding:7px;border-radius:9px;width:100%;text-align:left;border:0;background:none;cursor:pointer}
.u-row:hover{background:var(--muts)}
.av{width:30px;height:30px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:650;font-size:12px}
.u-meta{min-width:0}
.u-meta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-meta small{display:block;color:var(--tx3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{height:56px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:30}
.crumb{display:flex;align-items:center;gap:6px;color:var(--tx3);font-size:13px;min-width:0}
.crumb b{color:var(--tx);font-weight:600}
.crumb button{background:none;border:0;color:var(--tx3);cursor:pointer;font-size:13px;white-space:nowrap}
.crumb button:hover{color:var(--tx)}
.srch{margin-left:auto;position:relative;width:min(400px,36vw)}
.srch input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 34px;font-size:13px}
.srch input:focus{outline:none;border-color:var(--ac);background:var(--panel)}
.srch .ic{position:absolute;left:10px;top:9px;color:var(--tx3)}
.hd-act{display:flex;align-items:center;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--tx2);display:grid;place-items:center;cursor:pointer;position:relative}
.ib:hover{background:var(--muts);color:var(--tx)}
.ib .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--err);border:2px solid var(--panel)}
.pop{position:absolute;top:46px;right:12px;width:min(340px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);z-index:60;overflow:hidden}
.pop-h{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:650;font-size:13px}
.pop-i{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.pop-i:hover{background:var(--panel2)}
.pop-i small{color:var(--tx3);display:block;font-size:11.5px}
.wrap{padding:22px;max-width:1360px;width:100%;margin:0 auto}
h1{font-size:26px;font-weight:680;letter-spacing:-.7px;line-height:1.2}
h2{font-size:15px;font-weight:650;letter-spacing:-.2px}
h3{font-size:13.5px;font-weight:620}
.sub{color:var(--tx2);font-size:13.5px}
.meta{color:var(--tx3);font-size:12px}
.gr{background:linear-gradient(92deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.split{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.kpi{padding:15px 16px}
.kpi .top{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:10.5px;font-weight:650;letter-spacing:.6px}
.kpi .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--acs);color:var(--ac)}
.kpi .val{font-size:28px;font-weight:680;letter-spacing:-1px;margin-top:9px;line-height:1}
.kpi .fo{margin-top:7px;font-size:11.5px;color:var(--ok);font-weight:620}
.bar{height:5px;border-radius:99px;background:var(--muts);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.bg{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.bg .ic{width:11px;height:11px}
.b-ok{background:var(--oks);color:var(--ok)}.b-wa{background:var(--warns);color:var(--warn)}.b-er{background:var(--errs);color:var(--err)}.b-mu{background:var(--muts);color:var(--mut);border-color:var(--line)}.b-ac{background:var(--acs);color:var(--ac);border-color:var(--acl)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);font-size:13px;font-weight:560;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--muts)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn-p:hover{background:var(--ac2);border-color:var(--ac2)}
.btn-s{height:28px;padding:0 9px;font-size:12px;gap:5px}
.btn-g{border-color:transparent;background:none;color:var(--tx2)}
.btn-g:hover{background:var(--muts);color:var(--tx)}
.btn-w{width:100%;height:40px}
.inp,select.inp,textarea.inp{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 11px;font-size:13.5px}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;line-height:1.55}
.inp:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.fld{margin-bottom:13px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;background:var(--muts);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:560;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--panel);color:var(--tx);box-shadow:var(--sh)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-size:13.5px;font-weight:560;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:620}
.pc{padding:15px;cursor:pointer;display:flex;flex-direction:column;gap:11px;text-align:left;width:100%;font:inherit;color:inherit}
.pc:hover{border-color:var(--acl);box-shadow:var(--sh2)}
.lg{border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.pc .nm{font-weight:640;font-size:14.5px;letter-spacing:-.2px}
.pc .cl{color:var(--tx3);font-size:12px}
.pc .st{display:flex;gap:16px;flex-wrap:wrap}
.pc .st div{font-size:11.5px;color:var(--tx3)}
.pc .st b{display:block;color:var(--tx);font-size:14px;font-weight:640}
.desc{color:var(--tx2);font-size:12.8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.6px;color:var(--tx3);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--panel2)}
.fi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.tw{overflow-x:auto}
.dz{border:1.5px dashed var(--line2);border-radius:12px;padding:28px 20px;text-align:center;background:var(--panel2);cursor:pointer}
.dz:hover,.dz.hot{border-color:var(--ac);background:var(--acs)}
.dz .ico{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 11px;color:var(--ac)}
.emp{text-align:center;padding:40px 20px}
.emp .ico{width:46px;height:46px;border-radius:13px;background:var(--acs);color:var(--ac);display:grid;place-items:center;margin:0 auto 13px}
.emp h3{font-size:15px;margin-bottom:5px}
.emp p{color:var(--tx2);font-size:13px;margin-bottom:15px;max-width:390px;margin-left:auto;margin-right:auto}
.sk{background:linear-gradient(90deg,var(--muts) 25%,var(--line) 37%,var(--muts) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:7px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl-i{position:relative;padding:9px 0}
.tl-i .pt{position:absolute;left:-21px;top:11px;width:23px;height:23px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx3)}
.chat{display:grid;grid-template-columns:264px 1fr;height:calc(100vh - 56px)}
.cl{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.cl-s{padding:11px;border-bottom:1px solid var(--line)}
.cl-b{overflow-y:auto;flex:1;padding:8px}
.ag-i{display:flex;gap:9px;padding:8px;border-radius:9px;cursor:pointer;border:0;background:none;width:100%;text-align:left;align-items:center}
.ag-i:hover{background:var(--muts)}.ag-i.on{background:var(--acs)}
.ag-i .ai{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ag-i b{font-size:13px;font-weight:600;display:block;line-height:1.25}
.ag-i small{color:var(--tx3);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmain{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chd{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:11px;flex:none}
.cbody{flex:1;overflow-y:auto;padding:20px 16px}
.cinner{max-width:790px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:11px}
.msg .ma{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:650;color:#fff}
.msg .mb{min-width:0;flex:1}
.msg .mn{font-size:12px;font-weight:640;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.msg .mn span{color:var(--tx3);font-weight:500;font-size:11px}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;box-shadow:var(--sh)}
.msg.u .bub{background:var(--acs);border-color:var(--acl)}
.src{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.src .st{font-size:10.5px;font-weight:650;letter-spacing:.6px;color:var(--tx3);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.src button{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-bottom:5px;width:100%;text-align:left;cursor:pointer}
.src button:hover{border-color:var(--acl);background:var(--acs)}
.src b{font-size:12.2px;font-weight:600;color:var(--tx);display:block}
.src small{color:var(--tx3);font-size:11px}
.typ{display:flex;gap:4px;padding:4px 0}
.typ i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:bl 1.1s infinite}
.typ i:nth-child(2){animation-delay:.16s}.typ i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.comp{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
.comp-i{max-width:790px;margin:0 auto;border:1px solid var(--line2);border-radius:12px;background:var(--panel);padding:8px 9px}
.comp-i:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.comp textarea{width:100%;border:0;background:none;resize:none;outline:none;font-size:13.5px;line-height:1.55;max-height:170px;padding:4px 5px}
.comp-r{display:flex;align-items:center;gap:7px;margin-top:5px}
.mdl{position:relative;flex:none}
.mdl-b{height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;cursor:pointer;white-space:nowrap;max-width:200px}
.mdl-b:hover,.mdl-b[aria-expanded="true"]{background:var(--muts);color:var(--tx)}
.mdl-b .mdl-n{overflow:hidden;text-overflow:ellipsis}
.mdl-m{position:absolute;left:0;bottom:calc(100% + 8px);width:300px;max-width:calc(100vw - 40px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh2);padding:6px;z-index:30}
.mdl-h{font-size:10.5px;font-weight:650;letter-spacing:.06em;color:var(--tx3);padding:6px 9px 4px}
.mdl-o{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--tx)}
.mdl-o:hover{background:var(--muts)}
.mdl-o.on{background:var(--acs)}
.mdl-o b{display:block;font-size:13px;font-weight:600}
.mdl-o small{display:block;font-size:11.5px;color:var(--tx3);margin-top:1px}
.mdl-o .ck{margin-left:auto;color:var(--ac);flex:none;display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 8px;border-radius:7px;background:var(--muts);border:1px solid var(--line);font-size:11.5px;margin:0 5px 5px 0}
.chip button{border:0;background:none;cursor:pointer;color:var(--tx3);display:grid;place-items:center}
.mdb{font-size:13.6px;line-height:1.62;overflow-wrap:anywhere}
.mdb h1,.mdb h2,.mdb h3{margin:15px 0 7px;line-height:1.3}
.mdb h1{font-size:17px}.mdb h2{font-size:15px}.mdb h3{font-size:13.6px}
.mdb>*:first-child{margin-top:0}
.mdb p{margin:0 0 9px}.mdb p:last-child{margin-bottom:0}
.mdb ul,.mdb ol{margin:0 0 9px;padding-left:20px}
.mdb li{margin-bottom:3px}
.mdb code{background:var(--muts);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.mdb pre{background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin:11px 0;overflow:hidden}
.mdb pre .ph{display:flex;align-items:center;justify-content:space-between;padding:6px 11px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.5px;color:var(--tx3);font-weight:650}
.mdb pre code{display:block;padding:11px;background:none;border:0;overflow-x:auto;white-space:pre;font-size:12px}
.mdb table{border-collapse:collapse;width:100%;margin:11px 0;font-size:12.6px;display:block;overflow-x:auto}
.mdb th,.mdb td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.mdb th{background:var(--panel2);font-weight:650}
.mdb blockquote{border-left:3px solid var(--acl);padding:2px 0 2px 12px;color:var(--tx2);margin:9px 0}
.mdb hr{border:0;border-top:1px solid var(--line);margin:13px 0}
.ov{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.mo{background:var(--panel);border-radius:14px;box-shadow:var(--sh2);width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.mo-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.mo-b{padding:18px;overflow-y:auto}
.mo-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(370px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:10px;padding:11px 13px;box-shadow:var(--sh2);display:flex;gap:10px;align-items:flex-start}
.toast.ok{border-left-color:var(--ok)}.toast.er{border-left-color:var(--err)}
.toast b{font-size:13px;font-weight:620;display:block}
.toast small{color:var(--tx2);font-size:12px}
.alert{background:var(--errs);border:1px solid var(--err);color:var(--err);border-radius:9px;padding:10px 12px;font-size:12.8px;margin-bottom:13px;display:flex;gap:9px;align-items:flex-start}
.pill{padding:3px 9px;border-radius:99px;background:var(--muts);border:1px solid var(--line);font-size:11.5px;font-weight:550;display:inline-flex;align-items:center;gap:5px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .step{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:12.3px;font-weight:580;display:flex;align-items:center;gap:7px}
.flow .step.hi{border-color:var(--acl);background:var(--acs);color:var(--ac)}
.stat-dot{width:7px;height:7px;border-radius:50%;flex:none}
.mob-only{display:none}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}.login{grid-template-columns:1fr}.login-r{display:none}}
@media(max-width:860px){
 .sb{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh2)}
 body[data-drawer="1"] .sb{transform:none}
 .mob-only{display:inline-flex}.desk-only{display:none!important}
 .srch{width:auto;flex:1}
 .g4,.g3,.g2{grid-template-columns:1fr}
 .wrap{padding:14px}h1{font-size:21px}
 .chat{grid-template-columns:1fr}.cl{display:none}
 body[data-cl="1"] .cl{display:flex;position:absolute;inset:56px 0 0 0;z-index:40;width:100%}

function setDoc(id,patch){var a=S.data.documents;for(var i=0;i<a.length;i++)if(a[i].id===id){for(var k in patch)a[i][k]=patch[k];return a[i];}return null;}
function runIndex(id){
 var d=setDoc(id,{status:"queued",progress:0});if(!d)return;render();
 api("/ingest",{projectId:d.projectId,documentId:d.id,fileName:d.name,mimeType:d.mime,size:d.size,storagePath:d.storagePath})
 .then(function(r){
  var stages=(r&&r.data&&r.data.stages)||[{status:"processing",ms:700},{status:"extracting",ms:900},{status:"chunking",ms:800},{status:"embedding",ms:1100}];
  var i=0;
  (function step(){
   if(i>=stages.length){
    var ch=(r&&r.data&&r.data.estimatedChunks)||Math.max(12,Math.round((d.size||400000)/2600));
    setDoc(id,{status:"indexed",indexedAt:new Date().toISOString(),chunks:ch,progress:100});
    S.data.activity.unshift({actor:"Ingestion pipeline",action:"indexed",target:d.name,at:new Date().toISOString(),icon:"db",projectId:d.projectId});
    toast("Indexing complete",d.name+" — "+ch+" chunks embedded into pgvector","ok");render();return;}
   setDoc(id,{status:stages[i].status,progress:Math.round((i+1)/(stages.length+1)*100)});render();i++;setTimeout(step,stages[i-1].ms||800);
  })();
 }).catch(function(e){setDoc(id,{status:"failed",progress:null});toast("Indexing failed",d.name+" — "+e.message,"er");render();});
}
function addFiles(files,pid){
 var target=pid||(S.route.v==="proj"?S.route.id:null)||S.data.projects[0].id,added=0;
 Array.prototype.forEach.call(files,function(f){
  var e=ext(f.name);
  if(OKEXT.indexOf(e)<0){toast("Unsupported file type",f.name+" — allowed: "+OKEXT.join(", ").toUpperCase(),"er");return;}
  if(f.size>MAXMB*1048576){toast("File too large",f.name+" is "+bytes(f.size)+". Maximum is "+MAXMB+" MB.","er");return;}
  var id=uid("doc");
  S.data.documents.unshift({id:id,projectId:target,name:f.name,mime:f.type||"application/octet-stream",size:f.size,status:"uploading",progress:0,
   uploadedBy:S.data.user.name,uploadedAt:new Date().toISOString(),indexedAt:null,chunks:0,pages:null,
   storagePath:"gs://workplace-knowledge/organizations/"+S.data.organization.id+"/projects/"+target+"/documents/"+id+"/"+f.name,_file:f});
  added++;
  var pr=0,t=setInterval(function(){
   pr+=Math.random()*26+9;
   if(pr>=100){clearInterval(t);setDoc(id,{status:"uploaded",progress:100});
    S.data.activity.unshift({actor:S.data.user.name,action:"uploaded",target:f.name,at:new Date().toISOString(),icon:"up",projectId:target});
    toast("Upload complete",f.name+" is ready to index","ok");render();}
   else{setDoc(id,{progress:Math.round(pr)});render();}},260);
 });
 if(added){var p=proj(target);if(p)p.docCount+=added;}
 render();
}
function send(text){
 var t=(text||S.chat.draft||"").trim();
 if(!t||S.chat.sending)return;
 var conv=getConv(),a=agent(S.chat.agentId),p=proj(S.chat.projectId),u=S.data.user;
 var atts=S.chat.atts.map(function(f){return {name:f.name,size:f.size,type:f.type};});
 conv.msgs.push({role:"user",content:t,at:new Date().toISOString(),atts:atts});
 S.chat.draft="";S.chat.atts=[];S.chat.sending=true;S.chat.err=null;S.chat.last=t;render();
 var mdl=modelOf(S.chat.model);
 api("/chat",{projectId:p.id,agentId:a.id,conversationId:conv.id,message:t,model:mdl.id,userContext:{userId:u.id,role:u.role},attachments:atts})
 .then(function(r){
  S.chat.sending=false;
  if(!r||!r.success||!r.message)throw new Error("Malformed agent response");
  conv.msgs.push({role:"assistant",agentId:a.id,content:r.message.content,sources:S.settings.cite?(r.message.sources||[]):[],at:new Date().toISOString(),mode:r.mode,model:(r.model&&r.model.label)||mdl.name});
  a.conversations++;
  S.data.activity.unshift({actor:a.name,action:"answered a question in",target:p.client,at:new Date().toISOString(),icon:"spark",projectId:p.id});
  render();
 }).catch(function(e){S.chat.sending=false;S.chat.err=e.message;render();});
}
function download(id){
 var d=S.data.documents.filter(function(x){return x.id===id})[0];if(!d)return;
 var url,name;
 if(d._file){url=URL.createObjectURL(d._file);name=d.name;}
 else{var meta={documentId:d.id,projectId:d.projectId,name:d.name,mimeType:d.mime,size:d.size,status:d.status,chunks:d.chunks,storagePath:d.storagePath,uploadedBy:d.uploadedBy,uploadedAt:d.uploadedAt,indexedAt:d.indexedAt};
  url=URL.createObjectURL(new Blob([JSON.stringify(meta,null,2)],{type:"application/json"}));name=d.name.replace(/\.[^.]+$/,"")+".metadata.json";}
 var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
 setTimeout(function(){URL.revokeObjectURL(url);},1500);
 toast("Download started",d._file?d.name:"Metadata manifest for "+d.name,"ok");
}

  render();return;}
 if(a==="selagent"){S.chat.agentId=v;S.chat.err=null;document.body.setAttribute("data-cl","0");render();return;}
 if(a==="selproj"){S.chat.projectId=v;S.chat.err=null;document.body.setAttribute("data-cl","0");render();return;}
 if(a==="chatagent"){S.chat.agentId=pv[0];if(pv[1])S.chat.projectId=pv[1];go("#/chat");return;}
 if(a==="chatproj"){S.chat.projectId=v;go("#/chat");return;}
 if(a==="newconv"){S.chat.convs[convKey()]={id:uid("conv"),msgs:[]};S.chat.err=null;lastN=0;toast("New conversation","Context reset for this agent");render();return;}
 if(a==="starter"){send(v);return;}
 if(a==="send"){send();return;}
 if(a==="retry"){S.chat.err=null;send(S.chat.last);return;}
 if(a==="copy"){var txt=el.getAttribute("data-v")||"";
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast("Copied","Content copied to clipboard","ok");});
  else toast("Copy unavailable","Clipboard access blocked","er");return;}
},false);
document.addEventListener("input",function(ev){
 var el=ev.target.closest?ev.target.closest("[data-a]"):null;if(!el)return;
 var a=el.getAttribute("data-a");
 if(a==="gq"){S.gq=el.value;render();}
 else if(a==="pq"){S.proj.q=el.value;render();}
 else if(a==="kbq"){S.kb.q=el.value;}
 else if(a==="draft"){S.chat.draft=el.value;el.style.height="auto";el.style.height=Math.min(el.scrollHeight,170)+"px";
  var b=document.querySelector('[data-a="send"]');if(b)b.disabled=!el.value.trim()||S.chat.sending;}
},false);
document.addEventListener("change",function(ev){
 if(ev.target.id==="fpick"){addFiles(ev.target.files);return;}
 if(ev.target.id==="apick"){Array.prototype.forEach.call(ev.target.files,function(f){
  if(f.size>MAXMB*1048576){toast("File too large",f.name+" exceeds "+MAXMB+" MB","er");return;}S.chat.atts.push(f);});render();return;}
 var el=ev.target.closest?ev.target.closest("[data-a]"):null;if(!el)return;
 var a=el.getAttribute("data-a");
 if(a==="pstatus"){S.proj.status=el.value;render();}
 else if(a==="pclient"){S.proj.client=el.value;render();}
 else if(a==="psort"){S.proj.sort=el.value;render();}
},false);
document.addEventListener("keydown",function(e){
 if(!S.auth){if(e.key==="Enter"&&(e.target.id==="li_e"||e.target.id==="li_p")){e.preventDefault();doLogin();}return;}
 if(e.key==="/"&&["INPUT","TEXTAREA","SELECT"].indexOf(document.activeElement.tagName)<0){e.preventDefault();var g=document.getElementById("gsearch");if(g)g.focus();return;}
 if(e.key==="Escape"){if(S.modal){S.modal=null;render();}else if(S.chat.modelOpen){S.chat.modelOpen=false;render();}else if(S.pop){S.pop=null;render();}return;}
 if(e.target&&e.target.id==="cinput"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
 if(e.target&&e.target.id==="kbq"&&e.key==="Enter"){e.preventDefault();doSearch(S.route.v==="proj"?S.route.id:null);}
},false);
document.addEventListener("dragover",function(e){var d=e.target.closest?e.target.closest("#dz"):null;if(d){e.preventDefault();d.classList.add("hot");}},false);
document.addEventListener("dragleave",function(e){var d=e.target.closest?e.target.closest("#dz"):null;if(d)d.classList.remove("hot");},false);
document.addEventListener("drop",function(e){var d=e.target.closest?e.target.closest("#dz"):null;
 if(d){e.preventDefault();d.classList.remove("hot");if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);}},false);
window.addEventListener("hashchange",function(){S.route=parseHash();S.pop=null;document.body.setAttribute("data-drawer","0");window.scrollTo(0,0);render();});
function createProject(){
 var client=document.getElementById("np_client").value.trim(),name=document.getElementById("np_name").value.trim();
 if(!client||!name){toast("Missing details","Client and engagement name are required","er");return;}
 var cols=["#4f46e5","#0d8a5f","#b45309","#7c3aed","#c0392b","#0e7490"];
 var p={id:uid("proj"),name:name,client:client,description:document.getElementById("np_desc").value.trim()||"Newly created engagement. Add a description in project settings.",
  status:document.getElementById("np_status").value,manager:document.getElementById("np_mgr").value.trim()||S.data.user.name,partner:S.data.user.name,
  team:1,docCount:0,agentIds:[],progress:0,color:cols[Math.floor(Math.random()*cols.length)],
  initials:client.split(/\s+/).slice(0,2).map(function(w){return w[0]}).join("").toUpperCase(),
  startedAt:new Date().toISOString(),goLive:"TBD",lastActivity:new Date().toISOString(),modules:["Scoping"]};
 S.data.projects.unshift(p);S.data.kpis.activeProjects++;
 S.data.activity.unshift({actor:S.data.user.name,action:"created project",target:client,at:new Date().toISOString(),icon:"folder",projectId:p.id});
 S.modal=null;toast("Project created",client+" — "+name,"ok");go("#/projects/"+p.id);
}
S.route=parseHash();
if(S.token){S.auth=true;boot();}else{render();}
})();
</script>
</body>
</html>
