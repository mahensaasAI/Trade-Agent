<!DOCTYPE html>
<html lang="en" data-t="light">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#4f46e5">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Y Square Workplace</title>
<meta name="description" content="Y Square Workplace: Athlete Edge, StudyPals (tutor, lessons, quizzes), SynthIQ research and Event Planner, plus volunteer opportunities for students 12 to 21. Free with Open Weight Models; Premium adds Claude and ChatGPT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='.55' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23db2777'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='17' fill='url(%23g)'/%3E%3Ctext x='27' y='47' font-family='Inter,Arial,sans-serif' font-weight='900' font-size='40' fill='white' text-anchor='middle'%3EY%3C/text%3E%3Ctext x='48' y='25' font-family='Inter,Arial,sans-serif' font-weight='800' font-size='19' fill='%23fbbf24' text-anchor='middle'%3E2%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#fafbfc;--line:#e5e7eb;--line2:#d5d9e0;--tx:#0f1218;--tx2:#5a6170;--tx3:#8b91a0;--ac:#4f46e5;--ac2:#6366f1;--acs:#eef2ff;--acl:#c7d2fe;--hot:#f97316;--hot2:#fb923c;--hots:#fff4ea;--hotl:#fed7aa;--ok:#0d8a5f;--oks:#e6f5ee;--warn:#b45309;--warns:#fdf2e2;--err:#c0392b;--errs:#fdeceb;--info:#2563eb;--infos:#e8efff;--mut:#6b7280;--muts:#f0f1f4;--sh:0 1px 2px rgba(16,20,30,.05),0 1px 3px rgba(16,20,30,.05);--sh2:0 10px 30px rgba(16,20,30,.13);--r:12px}
[data-t="dark"]{--bg:#0c0e13;--panel:#151821;--panel2:#1a1e28;--line:#252a35;--line2:#343a48;--tx:#e9ebf1;--tx2:#9aa1b1;--tx3:#6d7484;--ac:#818cf8;--ac2:#a5b4fc;--acs:#1e1b4b;--acl:#3730a3;--hot:#fb923c;--hot2:#fdba74;--hots:#2a1a0f;--hotl:#7c2d12;--ok:#3fd699;--oks:#0f2a20;--warn:#f0b429;--warns:#2a2211;--err:#ff7070;--errs:#2d1618;--info:#7ea2ff;--infos:#1a2340;--mut:#8b91a0;--muts:#1c202a;--sh:0 1px 2px rgba(0,0,0,.45);--sh2:0 12px 34px rgba(0,0,0,.55)}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.ic{width:16px;height:16px;flex:none;display:block}.ic18{width:18px;height:18px}.ic22{width:22px;height:22px}
.hide{display:none!important}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* SHELL */
.shell{display:flex;min-height:100vh;width:100%}
.sb{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.sb-brand:hover{background:var(--muts)}.sb-brand:hover .logo{transform:translateY(-1px)}
.logo{width:40px;height:40px;flex:none;border-radius:11px;box-shadow:0 6px 16px rgba(79,70,229,.32);overflow:hidden;display:block;transition:transform .15s ease}.logo svg{width:100%;height:100%;display:block}
.sb-brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.4px}.sb-brand small{display:block;color:var(--ac);font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;margin-top:-1px}
.nav{padding:12px 10px;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--tx2);font-weight:500}
.nav a:hover{background:var(--muts);color:var(--tx)}.nav a.on{background:var(--acs);color:var(--ac)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);padding:16px 12px 6px;font-weight:600}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.plan-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:12.5px}
.plan-card b{display:block;margin-bottom:2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top h1{font-size:16px;font-weight:650;letter-spacing:-.3px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);font-size:12.5px}
.av{width:26px;height:26px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.content{padding:30px;flex:1;min-width:0}
.wrap{max-width:1180px;margin:0 auto}
/* BUTTONS + FORMS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);font-weight:550;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--muts)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:var(--ac2)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:7px}.btn.xs{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--muts)}
.btn.icon{padding:7px;border-radius:8px}
.f{display:grid;gap:5px;margin-bottom:12px}.f label{font-size:12.5px;font-weight:600;color:var(--tx2)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px var(--acl)}
.f .help{font-size:11.5px;color:var(--tx3)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
/* CARDS */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.card .hd h3{font-size:14px;font-weight:650}.card .hd .sp{flex:1}
.card .bd{padding:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi b{display:block;font-size:22px;letter-spacing:-.6px;font-weight:700}.kpi span{font-size:12px;color:var(--tx3)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--muts);color:var(--tx2);white-space:nowrap}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.warn{background:var(--warns);color:var(--warn)}.badge.err{background:var(--errs);color:var(--err)}.badge.ac{background:var(--acs);color:var(--ac)}.badge.info{background:var(--infos);color:var(--info)}
.muted{color:var(--tx3)}.small{font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{padding:34px 16px;text-align:center;color:var(--tx3)}
/* HOME */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;align-items:stretch;margin-bottom:22px}
.hero .lead{padding:30px 32px;border-radius:16px;background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 45%,#6d28d9 78%,var(--hot) 128%);color:#fff;display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero .lead h2{font-size:30px;letter-spacing:-.9px;line-height:1.15;font-weight:750}
.hero .lead p{opacity:.88;max-width:540px;font-size:15px}
.hero .lead .row{margin-top:6px}
.hero .lead .btn{background:#fff;border-color:#fff;color:#1e1b4b}.hero .lead .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.tiers{display:grid;gap:10px}
.tier{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);box-shadow:var(--sh)}
.tier b{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}.tier ul{list-style:none;display:grid;gap:4px;font-size:13px;color:var(--tx2)}
.tier li{display:flex;gap:7px;align-items:flex-start}.tier li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);margin-top:7px;flex:none}
.tier.prem{border-color:var(--hotl);background:linear-gradient(180deg,var(--hots),var(--panel))}.prem .btn.p,.plan-card .btn.p{background:var(--hot);border-color:var(--hot)}.prem .btn.p:hover,.plan-card .btn.p:hover{background:var(--hot2)}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.agent{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.agent:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.agent .ai{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff}
.agent h3{font-size:16px;letter-spacing:-.3px}.agent p{color:var(--tx2);font-size:13px}
.agent .caps{display:flex;flex-wrap:wrap;gap:5px}.agent .caps span{font-size:11.5px;background:var(--muts);border-radius:6px;padding:2px 7px;color:var(--tx2)}
.agent .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--ac)}
/* WORKSPACE (side panel + chat) */
.ws{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:start;min-height:calc(100vh - 110px)}
.ws .side{display:grid;gap:14px;position:sticky;top:76px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:520px}
.chat .hd .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:86%}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{padding:10px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.55;min-width:60px;overflow-wrap:anywhere}
.msg.me .bub{background:var(--ac);border-color:var(--ac);color:#fff;border-bottom-right-radius:4px}
.msg:not(.me) .bub{border-bottom-left-radius:4px}
.msg .meta{font-size:12px;color:var(--tx3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg.me .meta{justify-content:flex-end}
.bub h1,.bub h2,.bub h3{font-size:14.5px;margin:8px 0 4px}.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:0 0 8px 18px}.bub li{margin:2px 0}.bub code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:5px;font-size:12.5px}
.bub pre{background:rgba(127,127,127,.12);padding:10px;border-radius:8px;overflow:auto;margin:0 0 8px;font-size:12.5px}
.bub .expl-img{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:12px;margin:8px 0;border:1px solid var(--line2);background:var(--panel2)}
.sec-card .vis img{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin-top:6px;border:1px solid var(--line2);background:var(--panel2)}
.bub .tw{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line2);border-radius:10px}.bub table{border-collapse:collapse;font-size:13px;width:100%}.bub th,.bub td{border-bottom:1px solid var(--line2);padding:7px 10px;text-align:left;vertical-align:top}.bub tr:last-child td{border-bottom:0}.bub th{background:var(--acs);color:var(--ac);font-weight:600;white-space:nowrap}.bub tbody tr:nth-child(even) td{background:rgba(127,127,127,.06)}.bub td:first-child{font-weight:600;min-width:84px}
.bub blockquote{border-left:3px solid var(--ac);background:var(--acs);padding:8px 12px;border-radius:0 8px 8px 0;margin:4px 0 10px}.bub h3{color:var(--ac);font-size:14.5px;margin:12px 0 4px}.bub h3:first-child{margin-top:2px}.bub p>b:only-child{font-size:15px}
.sphint{margin:0 0 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sphint .ic{width:14px;height:14px}
.cite{display:inline-block;font-size:11px;font-weight:700;line-height:1.6;padding:0 5px;margin:0 1px;border-radius:5px;background:var(--acs);color:var(--ac);border:1px solid var(--acl);text-decoration:none;vertical-align:1px}
.cite:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.refs{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.refs>b{display:flex;align-items:center;gap:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx2);margin-bottom:6px;font-weight:700}
.refs>b svg{width:13px;height:13px}
.ref{display:flex;gap:9px;align-items:baseline;padding:3px 0;font-size:12.5px;line-height:1.45}
.ref .rn{flex:none;font-weight:700;color:var(--ac);font-size:11px;min-width:22px}
.ref a{color:var(--tx);text-decoration:none;border-bottom:1px solid var(--line2)}
.ref a:hover{color:var(--ac);border-color:var(--acl)}
.ref .rmeta{display:block;color:var(--tx2);font-size:11.5px;margin-top:1px}
.srcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.srcs span,.srcs a{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--tx2)}
.srcs a{color:var(--ac);text-decoration:none;font-weight:600}.srcs a:hover{border-color:var(--acl);background:var(--acs)}
.sqsrc{display:flex;flex-wrap:wrap;gap:7px}
.sqc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);color:var(--tx2);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.sqc svg{width:14px;height:14px}.sqc:hover{border-color:var(--acl)}.sqc.on{background:var(--acs);border-color:var(--acl);color:var(--ac)}
.sqoa{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--tx2);cursor:pointer}.sqoa input{width:16px;height:16px}
.plan{margin-top:10px;border:1px solid var(--acl);background:var(--acs);border-radius:10px;padding:10px 12px}
.plan b{display:block;margin-bottom:6px}.plan .it{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--acl);font-size:13px}
.plan .it em{font-style:normal;font-weight:600;color:var(--ac)}.plan .it small{display:block;color:var(--tx2)}
.act{margin-top:10px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:10px 12px}
.act b{display:block;margin-bottom:6px}.act ul{margin:0 0 8px 16px;font-size:13px;color:var(--tx2)}
.starters{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px}
.starters button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--tx2)}
.starters button:hover{border-color:var(--ac);color:var(--ac)}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.composer .box{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line2);border-radius:12px;padding:6px 6px 6px 12px;background:var(--panel)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:24px;max-height:160px;padding:6px 0;outline:none}
.composer .tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--tx3)}
.mp{position:relative}
.mp .cur{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2);cursor:pointer;font-size:12.5px;font-weight:550;color:var(--tx)}
.mp .menu{position:absolute;bottom:38px;left:0;min-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:6px;z-index:20}
.mp .menu .sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);padding:6px 10px 2px;font-weight:600}
.mp .menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer}
.mp .menu button:hover{background:var(--muts)}.mp .menu button.on{background:var(--acs)}
.mp .menu button .d{font-size:11.5px;color:var(--tx3);display:block}
.mp .menu button .lock{margin-left:auto;font-size:11px;color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* EVENTS */
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.ev{padding:20px;display:grid;gap:8px;cursor:pointer}
.ev:hover{box-shadow:var(--sh2)}
.ev h3{font-size:15px;letter-spacing:-.2px}.ev .when{color:var(--tx2);font-size:13px}
.ev .stats{display:flex;gap:12px;font-size:12px;color:var(--tx3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px;overflow:auto}
.tabs button{border:0;background:transparent;padding:11px 12px;font-weight:550;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{margin-top:4px;width:16px;height:16px;accent-color:var(--ok)}
.task .t{flex:1}.task .t b{font-weight:550}.task .t.done b{text-decoration:line-through;color:var(--tx3)}
.task .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.upd{padding:12px 0;border-top:1px solid var(--line)}.upd:first-child{border-top:0}
.upd h4{font-size:14px;display:flex;gap:8px;align-items:center}.upd p{color:var(--tx2);white-space:pre-wrap;margin-top:4px}
.upd .m{font-size:11.5px;color:var(--tx3);margin-top:4px}
.chatline{display:flex;gap:8px;padding:6px 0}.chatline .av{width:28px;height:28px;font-size:10px}
.chatline .b{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 11px;max-width:80%}
.chatline .b small{display:block;color:var(--tx3);font-size:11px}
.chatline.me{flex-direction:row-reverse}.chatline.me .b{background:var(--acs);border-color:var(--acl)}
.code-pill{font-family:ui-monospace,Menlo,monospace;background:var(--muts);padding:3px 8px;border-radius:7px;letter-spacing:1.5px;font-weight:700}
.rsvp{display:flex;gap:6px}.rsvp button.on{background:var(--oks);border-color:var(--ok);color:var(--ok)}
/* TABLES */
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}table.t th{color:var(--tx3);font-weight:600;font-size:12px}
/* MODAL + TOAST */

// quiz
function qObjective(q){if(typeof q.objective==="boolean")return q.objective;return ["multiple_choice","fill_blank","true_false"].indexOf(q.type)>=0;}
function qNorm(s){return String(s==null?"":s).toLowerCase().replace(/[.,;:!?'"`()\[\]{}]/g,"").replace(/\s+/g," ").trim();}
function qRight(q,ans){
 if(ans==null||!String(ans).trim())return false;
 var a=qNorm(ans),k=qNorm(q.answer);if(!k)return false;
 if(a===k||a.replace(/ /g,"")===k.replace(/ /g,""))return true;
 if(Array.isArray(q.options)){var idx=q.options.map(qNorm).indexOf(a);if(idx>=0){var letter="abcdefgh".charAt(idx);if(k===letter||k===String(idx+1)||k.indexOf(letter+" ")===0&&qNorm(k.slice(2))===a)return true;}}
 var na=Number(a.replace(/ /g,"")),nk=Number(k.replace(/ /g,""));if(a&&k&&isFinite(na)&&isFinite(nk)&&Math.abs(na-nk)<1e-9)return true;
 return false;
}
function qTotals(rec){var qs=(rec.quiz||{}).questions||[];var got=0,max=0,open=0;qs.forEach(function(q,i){var pts=Number(q.points)||1;if(qObjective(q)){max+=pts;if(qRight(q,rec.answers[i]))got+=pts;}else open++;});return {got:got,max:max,open:open};}

var SYNC_MAP={sp:"studypals",lessons:"studypals",quizzes:"studypals",ask:"studypals",quizPref:"studypals",convs:"chats"};
var SYNC_T={},SYNC_READY=false,LS_SET0=LS.set;

 if(ag==="studypals")return {sp:S.sp,lessons:S.lessons,quizzes:S.quizzes,ask:S.askLog,quizPref:LS.get("quizPref",null)};
 if(ag==="chats"){var c={};Object.keys(S.convs).forEach(function(k){var x=S.convs[k];if(x&&Array.isArray(x.messages)&&x.messages.length)c[k]={id:x.id,messages:x.messages.slice(-40)};});return {convs:c};}

function queueSync(ag){if(!SYNC_READY||!signedIn())return;clearTimeout(SYNC_T[ag]);SYNC_T[ag]=setTimeout(function(){pushState(ag);},1200);}
function pushState(){}/* replaced further down */
function lastAt(list){var t=0;(list||[]).forEach(function(m){var x=Number(m&&m.at)||(m&&m.at?new Date(m.at).getTime():0);if(x>t)t=x;});return t;}
function mergeById(a,b,max){var seen={},out=[];(a||[]).concat(b||[]).forEach(function(x){if(!x||typeof x!=="object")return;var k=String(x.id||x.at);if(seen[k]!=null){var i=seen[k];var y=out[i];if(x.submitted&&!y.submitted)out[i]=x;return;}seen[k]=out.length;out.push(x);});out.sort(function(p,q){return (Number(q.at)||0)-(Number(p.at)||0);});return out.slice(0,max);}
function mergeAsk(a,b){var seen={},out=[];(a||[]).concat(b||[]).forEach(function(x){if(!x)return;var k=x.at+"|"+x.role+"|"+String(x.content||"").slice(0,40);if(seen[k])return;seen[k]=1;out.push(x);});out.sort(function(p,q){return (Number(p.at)||0)-(Number(q.at)||0);});return out.slice(-30);}
function mergeConvs(a,b){var out={};[a||{},b||{}].forEach(function(src){Object.keys(src).forEach(function(k){var x=src[k];if(!x||!Array.isArray(x.messages))return;var y=out[k];if(!y||lastAt(x.messages)>lastAt(y.messages)||(lastAt(x.messages)===lastAt(y.messages)&&x.messages.length>y.messages.length))out[k]=x;});});return out;}

  LS_SET0("sp",S.sp);LS_SET0("lessons",S.lessons);LS_SET0("quizzes",S.quizzes);LS_SET0("ask",S.askLog);LS_SET0("convs",S.convs);LS_SET0("model",S.model);LS_SET0("syncOwner",me);
  SYNC_READY=true;
  var server={studypals:sp,chats:ch,prefs:pr};

 }).catch(function(){S.syncedFor=null;});

// ---- LaTeX clean-up for model answers (md() does not render TeX) ---------------------------------------------------
var TEXSYM={alpha:"α",beta:"β",gamma:"γ",delta:"δ",theta:"θ",pi:"π",phi:"φ",lambda:"λ",mu:"μ",sigma:"σ",omega:"ω",Delta:"Δ",Omega:"Ω",times:"×",cdot:"·",div:"÷",pm:"±",le:"≤",leq:"≤",ge:"≥",geq:"≥",ne:"≠",neq:"≠",approx:"≈",infty:"∞",circ:"°",degree:"°",rightarrow:"→",to:"→",Rightarrow:"⇒",quad:" ",qquad:" ",angle:"∠",triangle:"△",sqrt:"√"};
function texInline(x){var r=String(x);
 r=r.replace(/\\left|\\right/g,"").replace(/\\[,;:! ]/g," ");
 for(var i=0;i<3;i++)r=r.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,"($1)/($2)");
 r=r.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)").replace(/\\(?:text|mathrm|mathbf|operatorname)\s*\{([^{}]*)\}/g,"$1");
 r=r.replace(/\\([A-Za-z]+)/g,function(m,n){return Object.prototype.hasOwnProperty.call(TEXSYM,n)?TEXSYM[n]:n;});
 r=r.replace(/\^\{?\s*°\s*\}?/g,"°").replace(/\^\{([^{}]*)\}/g,"^($1)").replace(/_\{([^{}]*)\}/g,"_$1");
 return r.replace(/[{}]/g,"").replace(/[ \t]+/g," ").trim();}
function texClean(s){
 if(!/\\[\[\(]|\$\$|\\(d?frac|sin|cos|tan|cdot|times|sqrt|pi|theta|left|text)\b/.test(s))return s;
 return s.replace(/\\\[([\s\S]*?)\\\]/g,function(m,x){return "\n\n"+texInline(x)+"\n\n";})
  .replace(/\$\$([\s\S]*?)\$\$/g,function(m,x){return "\n\n"+texInline(x)+"\n\n";})
  .replace(/\\\(([\s\S]*?)\\\)/g,function(m,x){return texInline(x);});
}

var FIXED_MSG={NETWORK:"We could not connect. Check your internet connection and try again.",GOOGLE_TOKEN_INVALID:"Google sign-in did not work. Please try again.",GOOGLE_EMAIL_UNVERIFIED:"Please verify your Google email address, then try again.",GOOGLE_NOT_CONFIGURED:"Google sign-in is not available right now. Please use your email.",UNAUTHENTICATED:"Something went wrong. Please reload the page and try again.",DB_ERROR:"Something went wrong on our side. Please try again in a moment.",SIGNUP_FAILED:"We could not create your account. Please try again."};
var TECH_RE=/rate.?limit|\b(4\d\d|5\d\d)\b|groq|gemini|mistral|openai|anthropic|\btokens?\b|quota|database|schema|workflow|\bsql\b|n8n|webhook|https?:|api.?key|credential|stack|exception|undefined/i;
function friendlyMsg(e,fallback){var fb=fallback||"Something went wrong. Please try again in a moment.";if(!e)return fb;var c=String(e.code||"");if(FIXED_MSG[c])return FIXED_MSG[c];var m=String(e.message||"").trim();if(!SAFE_CODES[c]||!m||TECH_RE.test(m))return fb;return m;}
function cleanReply(t){t=String(t||"");if(!/json|code block|for the app/i.test(t))return t;return t.split("\n").filter(function(l){var x=l.replace(/[#*_>`\-\s]/g,"");return !(/json|code block|for the app/i.test(l)&&x.length<90);}).join("\n").replace(/(\n\s*(-{3,}|\*{3,})\s*)+$/,"").replace(/\n{3,}/g,"\n\n");}

  var fx=(String(file.name||"").match(/\.([a-z0-9]{2,5})$/i)||[])[1];
  if(!fx||V41_TYPES.indexOf(fx.toLowerCase())<0){toast(V41_TYPES_MSG,"err");return false;}

   var b64=String(reader.result||"").split(",").pop();

// ---- v26: keep lesson pictures across reloads, and admin controls for pictures --------------------------------------
// Lesson pictures are big (about 850 KB each). Local storage holds roughly 5 MB, so a lesson with three pictures blew
// the quota and the whole "lessons" save failed, which is why a reload brought the lesson back without them. Pictures
// now live in IndexedDB (far larger), and what is saved alongside the lesson is a short reference that is swapped back
// for the picture when the page loads. The server copy never carries pictures at all.
(function(){
var DBP=null;
function idb(){
 if(DBP)return DBP;
 DBP=new Promise(function(res,rej){
  try{
   var r=indexedDB.open("ys-img",1);
   r.onupgradeneeded=function(){try{r.result.createObjectStore("img");}catch(e){}};
   r.onsuccess=function(){res(r.result);};
   r.onerror=function(){rej(r.error);};
  }catch(e){rej(e);}
 });
 return DBP;
}
function idbPut(k,v){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("img","readwrite");t.objectStore("img").put(v,k);t.oncomplete=function(){res(true);};t.onerror=function(){rej(t.error);};});});}
function idbGet(k){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("img","readonly"),q=t.objectStore("img").get(k);q.onsuccess=function(){res(q.result||"");};q.onerror=function(){rej(q.error);};});});}
function idbClear(){return idb().then(function(d){return new Promise(function(res){var t=d.transaction("img","readwrite");t.objectStore("img").clear();t.oncomplete=function(){res(true);};t.onerror=function(){res(false);};});});}
window.YSIMG={put:idbPut,get:idbGet,clear:idbClear};
function isData(v){return typeof v==="string"&&v.slice(0,11)==="data:image/";}
function isRef(v){return typeof v==="string"&&v.slice(0,4)==="idb:";}
// Swap pictures out for references (and file the pictures) before anything is written to local storage.
function stash(list,tag){
 if(!Array.isArray(list))return list;
 return list.map(function(rec,ri){
  if(!rec||typeof rec!=="object")return rec;
  var id=String(rec.id||rec.lessonId||ri);
  var copy=JSON.parse(JSON.stringify(rec,function(k,v){return isData(v)?"__DATA__":v;}));
  // walk the original and the copy together so the pictures can be filed under stable keys
  function walk(src,dst,path){
   if(!src||typeof src!=="object"||!dst||typeof dst!=="object")return;
   Object.keys(src).forEach(function(k){
    var v=src[k];
    if(isData(v)){var key=tag+":"+id+":"+path+k;idbPut(key,v).catch(function(){});dst[k]="idb:"+key;}
    else if(v&&typeof v==="object")walk(v,dst[k],path+k+".");
   });
  }
  walk(rec,copy,"");
  return copy;
 });
}
// Put the pictures back after a reload, then redraw once they are all in.
function hydrate(list,done){
 if(!Array.isArray(list))return;
 var jobs=[];
 function walk(o){
  if(!o||typeof o!=="object")return;
  Object.keys(o).forEach(function(k){
   var v=o[k];
   if(isRef(v)){(function(obj,key,ref){jobs.push(idbGet(ref.slice(4)).then(function(data){if(data)obj[key]=data;else delete obj[key];}).catch(function(){delete obj[key];}));})(o,k,v);}
   else if(v&&typeof v==="object")walk(v);
  });
 }
 list.forEach(walk);
 if(jobs.length)Promise.all(jobs).then(function(){if(done)done();}).catch(function(){if(done)done();});
}

function keepInputs(fn){
 var ae=document.activeElement,saved=[],fk=null;
 function key(el){var f=el.form;return (f?(f.getAttribute("onsubmit")||""):"")+"|"+(el.getAttribute("name")||"");}
 function fields(){return [].slice.call(document.querySelectorAll("#app textarea[name],#app input[name]")).filter(function(el){var t=(el.type||"").toLowerCase();return t!=="hidden"&&t!=="checkbox"&&t!=="radio"&&t!=="file"&&t!=="password";});}
 try{fields().forEach(function(el){var k=key(el);if(el===ae)fk={k:k,s:el.selectionStart,e:el.selectionEnd};if(el.value)saved.push({k:k,v:el.value});});}catch(x){}
 fn();
 try{var all=fields();
  saved.forEach(function(x){var el=all.filter(function(y){return key(y)===x.k;})[0];if(el&&!el.value)el.value=x.v;});
  if(fk){var el=all.filter(function(y){return key(y)===fk.k;})[0];if(el){el.focus();try{el.setSelectionRange(fk.s,fk.e);}catch(x){}}}
 }catch(x){}
}

var LEGAL_PRIVACY="<p class=\"muted small\">Last updated: 26 September 2026</p>\n<p>This policy explains what Y Square Workplace (at ysquareai.com) collects, why, who it is shared with and the choices you have. Y Square Workplace is run by Y Square (\"Y Square\", \"we\", \"us\"). Many of the people who use it are students and young athletes, so we try to collect as little as we can and to explain it plainly.</p>\n<p>Questions, requests or help: <a href=\"mailto:ysquareplayground@gmail.com\">ysquareplayground@gmail.com</a>.</p>\n\n<h3>1. What we collect</h3>\n<p><b>If you create an account:</b> your name, email address, password (we store only a scrambled, one-way version of it, never the password itself), the month and year you were born, and your role and plan. If you are under 13 we also keep your parent's or guardian's email address and whether they approved your account. If you sign in with Google, we receive your name, email address, profile picture and Google account number from Google.</p>\n<p><b>If you use Y Square without an account (as a guest):</b> a random guest number kept in your browser, and a name if you choose to give one.</p>\n<p><b>What you create and share in the app:</b></p>\n<ul>\n<li>your questions and messages to our AI assistants (Athlete Edge, StudyPals, SynthIQ and the Event Planner) and their answers;</li>\n<li>your athlete profile if you fill it in (age group, sport, position, training days and time, goals, dietary notes such as allergies or a vegetarian diet, and favourite foods);</li>\n<li>StudyPals lessons, quizzes and questions, and the short memory the StudyPals tutor keeps of a conversation;</li>\n<li>pictures the app makes for you in Ask AI and in StudyPals lessons (paid plans only);</li>\n<li>events you create or join: event details, the names of members, RSVPs, party sizes, contact details you add, tasks, updates and event chat messages;</li>\n<li>volunteer opportunities you post, AI Playground class chat messages and assigned work, and files that coaches upload as class material.</li>\n</ul>\n<p><b>Usage and security information:</b> sign-in attempts and the network address they came from (to stop password guessing); for guests who are not signed in, a scrambled code made from the network address that changes every day and is deleted after two days (to limit free daily use per network); how many messages and roughly how many AI \"tokens\" you used each day, a record of each AI request (which assistant and model, its size, how long it took and whether it failed), and technical logs from our servers.</p>\n<p><b>Payments:</b> paid plans are paid through Stripe. Stripe handles your card; we never see or store card numbers. We receive your email address, the plan, the amount, whether the payment went through, and Stripe's reference numbers for your customer record and subscription.</p>\n<p><b>On your device:</b> the app stores your sign-in, guest number, settings, recent chats, lessons and quizzes in your browser's own storage so the app works quickly. Signing out removes them from that browser. Your browser may also keep copies of pictures it has shown until you clear your browser data. We do not use advertising cookies or tracking tools.</p>\n\n<h3>2. How we use it</h3>\n<ul>\n<li>to run the app: answer your questions, create lessons and quizzes, keep your events and chats, and remember your settings;</li>\n<li>to tailor answers, for example using your athlete profile to suggest food that suits your sport and diet;</li>\n<li>to keep accounts safe: confirm email addresses, limit sign-in attempts and daily use, and stop abuse;</li>\n<li>to send the emails the app needs: sign-up and password codes, a short welcome note the first time you sign in, parent approval requests and account notices;</li>\n<li>to handle paid plans, answer support requests and fix problems.</li>\n</ul>\n<p>We do not sell personal information, we do not show ads, and we do not use children's information for anything other than providing the app.</p>\n\n<h3>3. AI services and other companies we use</h3>\n<p>To answer you, the text you send to an assistant, together with the context it needs (for example your athlete profile or the event you are planning), is sent to the AI company that produces the answer. Depending on the assistant and your plan this is one of: Anthropic (Claude), Google (Gemini), Groq (open-weight models), Mistral AI or OpenAI (ChatGPT, and pictures in Ask AI and lessons on paid plans). StudyPals also uses Google to search the class materials. SynthIQ searches public research databases (Europe PMC, PubMed, Crossref and ClinicalTrials.gov) with search words taken from your question. Each company handles this data under its own terms for business customers. Please do not put private information you do not want to share into a chat.</p>\n<p>We also use Google Cloud (our database and file storage), Google sign-in, Google's Gmail service (to send our emails), Google Fonts (the app's typeface), jsDelivr (it delivers the tools that show PDF, Word and PowerPoint class files in your browser; the files themselves are not sent to it) and Stripe (payments). These companies process data only to provide their service to us.</p>\n<p>If you use the microphone or read-aloud buttons, your browser's own speech features are used; some browsers send the recording to their provider (for example Google in Chrome) to turn speech into text.</p>\n\n<h3>4. Who else can see what you share</h3>\n<ul>\n<li>Members of an event see its details, updates, chat and the names and RSVPs of other members. Organisers and helpers manage the event.</li>\n<li>In the AI Playground, your coach and the other approved students in your class see class announcements, the class chat and assigned work.</li>\n<li>Volunteer opportunities you post are shown to everyone once an administrator approves them.</li>\n<li>Anyone who has the private link to a picture made for you can open that picture.</li>\n<li>Y Square administrators can see account details and usage to run the service and help you.</li>\n<li>We may share information if the law requires it, or to protect the safety of our users.</li>\n</ul>\n\n<h3>5. Children and parents</h3>\n<p>Y Square is used by students and young athletes. Anyone under 13 needs a parent's or guardian's approval before their account can be used: when a child signs up we email the parent a link to review and approve or decline the account. Until a parent approves, the account cannot be used; if the parent declines, the account is deleted.</p>\n<p>Parents and guardians can ask us at any time to see the information we hold about their child, to correct or delete it, or to stop any further collection, by emailing <a href=\"mailto:ysquareplayground@gmail.com\">ysquareplayground@gmail.com</a>. We collect only the information a child needs to use the app. If you are between 13 and 17, please use Y Square with your parent's or guardian's permission.</p>\n\n<h3>6. How long we keep it</h3>\n<ul>\n<li>Account information is kept while your account is open. If you ask us to delete your account, we delete it within 30 days.</li>\n<li>An account waiting for a parent's approval is never activated; if the parent declines, it is deleted straight away.</li>\n<li>Events, chats, lessons and other things you create are kept while your account, or the event or class they belong to, exists. You can ask us to delete them at any time.</li>\n<li>Pictures made for you in Ask AI and StudyPals lessons are kept on our servers for 90 days, so they still show when you come back, and are then deleted automatically. Each picture has its own long private link that cannot be guessed; anyone you give that link to can open the picture.</li>\n<li>Information stored in your browser stays there until you sign out or clear your browser data.</li>\n<li>Security and technical records are kept only as long as needed to protect and fix the service.</li>\n</ul>\n\n<h3>7. Security</h3>\n<p>Passwords are stored with strong one-way hashing, sign-in sessions use long random keys, all traffic is encrypted with HTTPS, and access to our systems is limited. No system is perfectly secure, so please use a password you do not use anywhere else and sign out on shared computers.</p>\n\n<h3>8. Your choices and rights</h3>\n<p>You can see and change most of your information in the app. You can ask us to give you a copy of your information, to correct it or to delete your account by emailing <a href=\"mailto:ysquareplayground@gmail.com\">ysquareplayground@gmail.com</a>. Depending on where you live, you may have further rights under laws such as the GDPR or US state privacy laws; we will honour them. We will not treat you differently for using your rights.</p>\n\n<h3>9. Where your information is processed</h3>\n<p>Our servers and the companies listed above may process information in the United States and in other countries.</p>\n\n<h3>10. Changes to this policy</h3>\n<p>If we change this policy we will update the date at the top, and for important changes we will tell you in the app (and ask a parent again where the law requires it).</p>\n\n<h3>11. Contact</h3>\n<p>Y Square — <a href=\"mailto:ysquareplayground@gmail.com\">ysquareplayground@gmail.com</a> for privacy questions and requests, and for everything else.</p>\n";

ays check with them about allergies, medical conditions, weight or anything that worries you.</li>\n<li>StudyPals helps you learn; check important answers with your teacher or coach, and follow your school's rules about using AI for homework and tests.</li>\n<li>SynthIQ lists the research sources it used; read the sources before relying on a summary.</li>\n<li>You are responsible for the decisions you make using the app.</li>\n</ul>\n\n<h3>5. Using the app responsibly</h3>\n<p>Do not use Y Square to:</p>\n<ul>\n<li>bully, harass, threaten or discriminate against anyone, or post hateful, violent or sexual content;</li>\n<li>share someone else's personal information without their permission;</li>\n<li>try to get around limits, access other people's accounts or data, break or overload the app, or copy it with automated tools;</li>\n<li>send spam, scams or anything illegal;</li>\n<li>upload material you do not have the right to share (coaches: only upload class material you are allowed to use).</li>\n</ul>\n<p>We may remove content and suspend or close accounts that break these rules, and we may report illegal activity.</p>\n\n<h3>6. Your content</h3>\n<p>What you write and upload stays yours. You allow us to store it, show it to the people you share it with (for example the members of your event or class), and send it to the AI companies that produce answers, only so that we can run the app for you. You can ask us to delete it at any time.</p>\n\n<h3>7. Paid plans</h3>\n<ul>\n<li>Prices and what each plan includes are shown in the app before you pay. Payments are handled by Stripe.</li>\n<li>Plans are paid monthly and renew automatically until you cancel. You can switch plans or cancel at any time with Manage billing on your Account page, or by emailing <a href=\"mailto:ysquareplayground@gmail.com\">ysquareplayground@gmail.com</a>; after you cancel, your plan stays active until the end of the period you paid for.</li>\n<li>Payments are not refundable except where the law requires it or where we decide to make an exception.</li>\n<li>If we change a price, we will tell you before it applies to you, and you can cancel before then.</li>\n</ul>\n\n<h3>8. Events and volunteer opportunities</h3>\n<p>Event organisers are responsible for their events; Y Square is not a party to them. Volunteer opportunities are run by other organisations. We do not check those organisations, so young people should involve a parent or guardian before signing up to volunteer.</p>\n\n<h3>9. No guarantees</h3>\n<p>We work hard to keep Y Square running and accurate, but the app is provided \"as is\" and \"as available\", without warranties of any kind, to the extent the law allows.</p>\n\n<h3>10. Limits on our liability</h3>\n<p>To the extent the law allows, Y Square is not liable for indirect or consequential losses, or for losses caused by relying on AI answers, and our total liability to you is limited to the amount you paid us in the 12 months before the claim (or 50 US dollars if you did not pay). Nothing in these terms limits rights you have under consumer protection law that cannot be limited.</p>\n\n<h3>11. Ending your use</h3>\n<p>You can stop using Y Square at any time and ask us to delete your account at <a href=\"mailto:ysquareplayground@gmail.com\">ysquareplayground@gmail.com</a>. We may suspend or close an account that breaks these terms or puts other users at risk.</p>\n\n<h3>12. Changes and law</h3>\n<p>We may update these terms; the date at the top shows the latest version, and for important changes we will tell you in the app before they take effect. These terms are governed by the laws that apply where Y Square is established, except where the law of your home country gives you rights that cannot be changed.</p>\n\n<h3>13. Contact</h3>\n<p>Y Square — <a href=\"mailto:ysquareplayground@gmail.com\">ysquareplayground@gmail.com</a>, including privacy requests.</p>\n";

 return fetch(BASE+"/svc/plan",{method:"POST",headers:headers(),body:JSON.stringify({action:action,payload:payload||{}})})
  .then(function(r){return r.json().catch(function(){return {success:false,error:{code:"BAD_RESPONSE",message:"The server returned an unexpected response ("+r.status+")."}};});})
  .then(function(j){
   if(j&&j.success)return j.data;
   var e=(j&&j.error)||{code:"ERROR",message:"Request failed."};
   if(e.code==="INVALID_SESSION"&&S.token){clearSession();wipeLocal();toast("Your session ended. Please sign in again.","err");setTimeout(function(){boot();},0);}
   throw e;
  },function(){throw {code:"NETWORK",message:"We could not connect. Check your internet connection and try again."};});

function yplTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";}catch(e){return "UTC";}}
function yplYmd(d){var p=function(n){return (n<10?"0":"")+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function yplHm(d){var p=function(n){return (n<10?"0":"")+n;};return p(d.getHours())+":"+p(d.getMinutes());}
function yplDay0(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
function yplTime(d){return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}
function yplDayName(d){var t=yplDay0(new Date()),x=yplDay0(d),n=Math.round((x-t)/864e5);return n===0?"Today":n===1?"Tomorrow":n===-1?"Yesterday":d.toLocaleDateString([],{weekday:"long"});}
function yplLocal(date,hm){var a=String(date||"").split("-"),b=String(hm||"00:00").split(":");return new Date(+a[0],+a[1]-1,+a[2],+b[0]||0,+b[1]||0);}
function yplRepeatText(it){
 if(!it.repeat)return "";
 var t=it.repeat==="daily"?"Every day":it.repeat==="weekdays"?"Weekdays":"Every "+((it.repeat_days&&it.repeat_days.length?it.repeat_days:[new Date(it.starts_at).getDay()]).map(function(d){return YPL_DOW[d];}).join(", "));
 return t+(it.repeat_until?" until "+new Date(it.repeat_until+"T12:00:00").toLocaleDateString([],{month:"short",day:"numeric"}):"");
}
// Every occurrence between from and to (repeating items expanded), plus group events the person is going to.
function yplOcc(from,to){
 var st=yplState(),out=[];
 (st.items||[]).forEach(function(it){
  var s=new Date(it.starts_at),dur=it.ends_at?(new Date(it.ends_at)-s):0;
  if(!it.repeat){if(s>=from&&s<to)out.push({it:it,at:s,end:dur?new Date(+s+dur):null});return;}
  var until=it.repeat_until?new Date(it.repeat_until+"T23:59:59"):null;
  var d=yplDay0(new Date(Math.max(+from,+yplDay0(s))));
  for(var guard=0;d<to&&guard<400;guard++,d.setDate(d.getDate()+1)){
   if(until&&d>until)break;
   var dow=d.getDay(),days=it.repeat_days&&it.repeat_days.length?it.repeat_days:[s.getDay()];
   if(!(it.repeat==="daily"||(it.repeat==="weekdays"&&dow>=1&&dow<=5)||(it.repeat==="weekly"&&days.indexOf(dow)>=0)))continue;
   var at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),s.getHours(),s.getMinutes());
   if(at<yplDay0(s)||at<from||at>=to)continue;
   out.push({it:it,at:at,end:dur?new Date(+at+dur):null});
  }
 });
 ((S.boot||{}).events||[]).forEach(function(e){
  if(!e.starts_at||!(e.my_rsvp==="yes"||e.is_owner))return;
  var at=new Date(e.starts_at);if(at>=from&&at<to)out.push({ev:e,at:at,end:e.ends_at?new Date(e.ends_at):null});
 });
 var f=yplState().filter;
 if(f!=="all")out=out.filter(function(o){var k=o.ev?"event":o.it.kind;return f==="other"?(k==="other"||k==="task"):k===f;});
 return out.sort(function(a,b){return a.at-b.at;});
}

// The age groups now run past 22 into adult groups, and the disclaimer under the athlete profile speaks to adults as
// well as young athletes (the agent itself follows the age group: child rules under 18, adult rules from 18).
// Signed in, "Add profile" / "Edit" opens the form with the blanks filled in from the account: the first name as the
// athlete name, and the age group worked out from the month and year of birth given at sign-up (POST /svc/me, workflow
// "Y Square - Account Basics"). Only empty fields are filled, except an old "18-22" that the account's age has
// outgrown (22 used to be the oldest choice). Nothing is saved until the person presses Save profile.
AGE_GROUPS.splice(0,AGE_GROUPS.length,"8-11","12-14","15-17","18-22","23-29","30-39","40-49","50-59","60+");
var YAT={me:null,tok:null,busy:false};

var YAT_NOTE="Athlete Edge gives food-first guidance for athletes of every age. It is not medical advice and never recommends supplements or diets for anyone under 18. For health concerns talk to a doctor or registered dietitian (and a parent for young athletes).";
// Age on the conservative side, as at sign-up: in the birth month itself the birthday counts as not reached yet.
function yatAge(by,bm){var n=new Date(),y=n.getFullYear(),m=n.getMonth()+1;by=Number(by);bm=Number(bm);if(!(by>=1900&&by<=y)||!(bm>=1&&bm<=12))return null;return y-by-(m<=bm?1:0);}
function yatGroup(age){if(age==null||!(age>=0))return "";if(age<12)return "8-11";if(age<15)return "12-14";if(age<18)return "15-17";if(age<23)return "18-22";if(age<30)return "23-29";if(age<40)return "30-39";if(age<50)return "40-49";if(age<60)return "50-59";return "60+";}
function yatLoad(){
 if(!signedIn()){YAT.me=null;YAT.tok=null;return;}
 if(YAT.tok===S.token&&(YAT.me||YAT.busy))return;
 var tok=S.token;YAT.tok=tok;YAT.me=null;YAT.busy=true;
 fetch(BASE+"/svc/me",{method:"POST",headers:headers(),body:"{}"}).then(function(r){return r.json();}).then(function(j){
  YAT.busy=false;if(S.token!==tok)return;
  YAT.me=(j&&j.success&&j.data)?j.data:{};

 }).catch(function(){YAT.busy=false;if(S.token===tok)YAT.me={};});

function yatPrefill(p){
 var me=YAT.me||{},a=actor(),out={},hit={};
 var first=String(me.firstName||String(a.name||"").split(" ")[0]||"").trim();
 if(!String(p.athlete_name||"").trim()&&first&&first!=="Guest"){out.athlete_name=first;hit.name=true;}
 var g=yatGroup(yatAge(me.birthYear,me.birthMonth));

 if(g&&(!cur||(cur==="18-22"&&AGE_GROUPS.indexOf(g)>AGE_GROUPS.indexOf("18-22")))){if(g!==cur){out.age_group=g;hit.age=true;}}

// ---- One place to sign in: the account menu at the top right (ysa) -----------------------------------------------------
// Like Google's apps: signed out, the header shows one "Sign in" button that opens the sign-in page (#/account, which
// keeps Google sign-in, email sign-in and sign-up). Signed in, the header shows the member's picture or initials; it
// opens a card with their name, email and plan, "Manage your account" and "Sign out". Everywhere else the extra
// sign-in buttons and links are taken out: the "Guest" chip, the menu's "Sign in / Sign up" and "Account" items, the
// plan box button, and the buttons and links inside pages (a link becomes plain text). Pop-ups that are a step of
// something the person started (upgrading, saving) still offer sign-in, and so does the sign-in page itself.
(function(){var st=document.createElement("style");st.id="ysacss";st.textContent=
 ".ysa{position:relative;display:flex;align-items:center}"+

 ".ysa-av:focus-visible{outline:2px solid var(--ac);outline-offset:2px}"+
 ".ysa-av .av{width:32px;height:32px;font-size:12px}"+
 ".ysa-p{position:absolute;right:0;top:calc(100% + 10px);width:340px;max-width:calc(100vw - 24px);padding:16px 18px 12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 36px rgba(15,23,42,.18);z-index:60;text-align:center;display:grid;gap:10px;justify-items:center}"+
 ".ysa-mail{font-size:13px;color:var(--tx2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}"+
 ".ysa-p .av.big{width:76px;height:76px;font-size:28px;margin-top:4px}"+
 ".ysa-hi{font-size:20px;font-weight:600;letter-spacing:-.3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}"+
 ".ysa-p .btn.ysa-man{border-radius:999px;padding:8px 18px;border-color:var(--line2)}"+
 ".ysa-p .btn.ysa-out{width:100%;justify-content:center;border-radius:14px;margin-top:4px}"+
 ".ysa-foot{display:flex;gap:10px;justify-content:center;font-size:11.5px;color:var(--tx3);padding-top:2px}.ysa-foot a{color:var(--tx3)}"+
 ".ysa-in{white-space:nowrap}"+
 ".v39act:empty{display:none}";

var YSA={open:false,hash:""};

function ysaEmail(a){return a.email||((S.user||{}).email)||((S.account||{}).user||{}).email||"";}
function ysaPlan(){try{return tierName(myTier());}catch(e){return isPremium()?"Premium":"Free";}}
function ysaInner(){
 var a=actor();

 return h+'<div class="ysa-p" role="dialog" aria-label="Your account">'+
  '<div class="ysa-mail">'+esc(ysaEmail(a))+'</div>'+ysaAvatar(a,true)+

}

// Takes the other sign-in buttons and links out of the menu and the pages (not the header, pop-ups or sign-in page).
function ysaSweep(){
 var app=document.getElementById("app");if(!app)return;
 var sb=app.querySelector(".sb");
 if(sb){

(function(){

 new MutationObserver(function(){if(queued)return;queued=true;setTimeout(function(){queued=false;ysaSweep();},0);}).observe(app,{childList:true,subtree:true});
})();

// ---- Chat layout for the agents (ych) ----------------------------------------------------------------------------------
// Athlete Edge, SynthIQ and StudyPals (Tutor and Ask AI) give the conversation the room. On a laptop the page no longer
// scrolls: the settings bar, the chat and a slim footer fit the window, and the chat takes all the height that is left.
// - SynthIQ's sources and filters sit on one line; the filters open from a "Filters" button that counts what is set.
// - StudyPals' grade, subject and topic sit on one line, with slimmer tabs.
// - The disclaimers ("not medical advice", "a study aid", which Tutor answers from) move from above the chat to one
//   small line under the message box, the way chat apps show them. Phones get a one-line short form (they used to show
//   no disclaimer at all).
var YCH={fil:false};
// Short forms for phones, where every line counts.
var YCH_SHORT={
 "agent-athlete":"Food-first guidance, not medical advice. Ask a doctor or dietitian about health concerns.",
 "agent-synthiq":"A study aid, not clinical advice. Check the cited papers."
};
var YCH_NOTES={
 "agent-synthiq":"SynthIQ searches only the sources you switch on and cites what it finds. It is a study aid, not clinical advice.",
 "agent-askai":"Ask AI answers any question, even outside your class materials. For answers from what your coach uploaded, use <a href=\"#\" onclick=\"A.spTab('tutor');return false\">Tutor</a>."
};
function ychNote(a){
 if(!a)return "";
 if(a.id==="agent-athlete")return esc(typeof YAT_NOTE!=="undefined"?YAT_NOTE:"Athlete Edge gives food-first guidance. It is not medical advice.");
 if(a.id==="agent-studypals")return 'Tutor answers from your class materials for '+esc(spLabel())+'. For anything else, try <a href="#" onclick="A.spTab(\'askai\');return false">Ask AI</a>.';

}

 "}"+
 "@media(max-width:760px){.ych-note{padding:0 12px 6px;font-size:10.5px}.ych-note .ych-l{display:none}.ych-note .ych-s{display:inline}.ych-bar .sqrow{padding:8px 10px}.ych-bar .sqlab b{display:none}}";
