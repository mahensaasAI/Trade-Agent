<!DOCTYPE html>
<html lang="en" data-t="light">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#4f46e5">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Y Square Workplace</title>
<meta name="description" content="Y Square Workplace: Athlete Edge, StudyPals (tutor, lessons, quizzes) and Event Planner agents, plus volunteer opportunities. Free with Open Weight Models; Premium adds Claude and ChatGPT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='.55' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23db2777'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='17' fill='url(%23g)'/%3E%3Ctext x='27' y='47' font-family='Inter,Arial,sans-serif' font-weight='900' font-size='40' fill='white' text-anchor='middle'%3EY%3C/text%3E%3Ctext x='48' y='25' font-family='Inter,Arial,sans-serif' font-weight='800' font-size='19' fill='%23fbbf24' text-anchor='middle'%3E2%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#fafbfc;--line:#e5e7eb;--line2:#d5d9e0;--tx:#0f1218;--tx2:#5a6170;--tx3:#8b91a0;--ac:#4f46e5;--ac2:#6366f1;--acs:#eef2ff;--acl:#c7d2fe;--hot:#f97316;--hot2:#fb923c;--hots:#fff4ea;--hotl:#fed7aa;--ok:#0d8a5f;--oks:#e6f5ee;--warn:#b45309;--warns:#fdf2e2;--err:#c0392b;--errs:#fdeceb;--info:#2563eb;--infos:#e8efff;--mut:#6b7280;--muts:#f0f1f4;--sh:0 1px 2px rgba(16,20,30,.05),0 1px 3px rgba(16,20,30,.05);--sh2:0 10px 30px rgba(16,20,30,.13);--r:12px}
[data-t="dark"]{--bg:#0c0e13;--panel:#151821;--panel2:#1a1e28;--line:#252a35;--line2:#343a48;--tx:#e9ebf1;--tx2:#9aa1b1;--tx3:#6d7484;--ac:#818cf8;--ac2:#a5b4fc;--acs:#1e1b4b;--acl:#3730a3;--hot:#fb923c;--hot2:#fdba74;--hots:#2a1a0f;--hotl:#7c2d12;--ok:#3fd699;--oks:#0f2a20;--warn:#f0b429;--warns:#2a2211;--err:#ff7070;--errs:#2d1618;--info:#7ea2ff;--infos:#1a2340;--mut:#8b91a0;--muts:#1c202a;--sh:0 1px 2px rgba(0,0,0,.45);--sh2:0 12px 34px rgba(0,0,0,.55)}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.ic{width:16px;height:16px;flex:none;display:block}.ic18{width:18px;height:18px}.ic22{width:22px;height:22px}
.hide{display:none!important}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* SHELL */
.shell{display:flex;min-height:100vh;width:100%}
.sb{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.sb-brand:hover{background:var(--muts)}.sb-brand:hover .logo{transform:translateY(-1px)}
.logo{width:40px;height:40px;flex:none;border-radius:11px;box-shadow:0 6px 16px rgba(79,70,229,.32);overflow:hidden;display:block;transition:transform .15s ease}.logo svg{width:100%;height:100%;display:block}
.sb-brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.4px}.sb-brand small{display:block;color:var(--ac);font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;margin-top:-1px}
.nav{padding:12px 10px;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--tx2);font-weight:500}
.nav a:hover{background:var(--muts);color:var(--tx)}.nav a.on{background:var(--acs);color:var(--ac)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);padding:12px 11px 4px;font-weight:600}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.plan-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:12.5px}
.plan-card b{display:block;margin-bottom:2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top h1{font-size:16px;font-weight:650;letter-spacing:-.3px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);font-size:12.5px}
.av{width:26px;height:26px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.content{padding:22px;flex:1;min-width:0}
.wrap{max-width:1180px;margin:0 auto}
/* BUTTONS + FORMS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);font-weight:550;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--muts)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:var(--ac2)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:7px}.btn.xs{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--muts)}
.btn.icon{padding:7px;border-radius:8px}
.f{display:grid;gap:5px;margin-bottom:12px}.f label{font-size:12.5px;font-weight:600;color:var(--tx2)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px var(--acl)}
.f .help{font-size:11.5px;color:var(--tx3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* CARDS */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card .hd h3{font-size:14px;font-weight:650}.card .hd .sp{flex:1}
.card .bd{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi b{display:block;font-size:22px;letter-spacing:-.6px;font-weight:700}.kpi span{font-size:12px;color:var(--tx3)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--muts);color:var(--tx2);white-space:nowrap}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.warn{background:var(--warns);color:var(--warn)}.badge.err{background:var(--errs);color:var(--err)}.badge.ac{background:var(--acs);color:var(--ac)}.badge.info{background:var(--infos);color:var(--info)}
.muted{color:var(--tx3)}.small{font-size:12.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{padding:34px 16px;text-align:center;color:var(--tx3)}
/* HOME */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch;margin-bottom:22px}
.hero .lead{padding:30px 32px;border-radius:16px;background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 45%,#6d28d9 78%,var(--hot) 128%);color:#fff;display:flex;flex-direction:column;gap:12px;justify-content:center}
.hero .lead h2{font-size:30px;letter-spacing:-.9px;line-height:1.15;font-weight:750}
.hero .lead p{opacity:.88;max-width:540px;font-size:15px}
.hero .lead .row{margin-top:6px}
.hero .lead .btn{background:#fff;border-color:#fff;color:#1e1b4b}.hero .lead .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.tiers{display:grid;gap:10px}
.tier{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);box-shadow:var(--sh)}
.tier b{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}.tier ul{list-style:none;display:grid;gap:4px;font-size:13px;color:var(--tx2)}
.tier li{display:flex;gap:7px;align-items:flex-start}.tier li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);margin-top:7px;flex:none}
.tier.prem{border-color:var(--hotl);background:linear-gradient(180deg,var(--hots),var(--panel))}.prem .btn.p,.plan-card .btn.p{background:var(--hot);border-color:var(--hot)}.prem .btn.p:hover,.plan-card .btn.p:hover{background:var(--hot2)}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.agent{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.agent:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.agent .ai{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff}
.agent h3{font-size:16px;letter-spacing:-.3px}.agent p{color:var(--tx2);font-size:13px}
.agent .caps{display:flex;flex-wrap:wrap;gap:5px}.agent .caps span{font-size:11.5px;background:var(--muts);border-radius:6px;padding:2px 7px;color:var(--tx2)}
.agent .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--ac)}
/* WORKSPACE (side panel + chat) */
.ws{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start;min-height:calc(100vh - 110px)}
.ws .side{display:grid;gap:14px;position:sticky;top:76px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:520px}
.chat .hd .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:86%}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{padding:10px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.55;min-width:60px;overflow-wrap:anywhere}
.msg.me .bub{background:var(--ac);border-color:var(--ac);color:#fff;border-bottom-right-radius:4px}
.msg:not(.me) .bub{border-bottom-left-radius:4px}
.msg .meta{font-size:11px;color:var(--tx3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg.me .meta{justify-content:flex-end}
.bub h1,.bub h2,.bub h3{font-size:14.5px;margin:8px 0 4px}.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:0 0 8px 18px}.bub li{margin:2px 0}.bub code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:5px;font-size:12.5px}
.bub pre{background:rgba(127,127,127,.12);padding:10px;border-radius:8px;overflow:auto;margin:0 0 8px;font-size:12.5px}
.bub .expl-img{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:12px;margin:8px 0;border:1px solid var(--line2);background:var(--panel2)}
.sec-card .vis img{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin-top:6px;border:1px solid var(--line2);background:var(--panel2)}
.bub .tw{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line2);border-radius:10px}.bub table{border-collapse:collapse;font-size:13px;width:100%}.bub th,.bub td{border-bottom:1px solid var(--line2);padding:7px 10px;text-align:left;vertical-align:top}.bub tr:last-child td{border-bottom:0}.bub th{background:var(--acs);color:var(--ac);font-weight:600;white-space:nowrap}.bub tbody tr:nth-child(even) td{background:rgba(127,127,127,.06)}.bub td:first-child{font-weight:600;min-width:84px}
.bub blockquote{border-left:3px solid var(--ac);background:var(--acs);padding:8px 12px;border-radius:0 8px 8px 0;margin:4px 0 10px}.bub h3{color:var(--ac);font-size:14.5px;margin:12px 0 4px}.bub h3:first-child{margin-top:2px}.bub p>b:only-child{font-size:15px}
.sphint{margin:0 0 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sphint .ic{width:14px;height:14px}
.cite{display:inline-block;font-size:11px;font-weight:700;line-height:1.6;padding:0 5px;margin:0 1px;border-radius:5px;background:var(--acs);color:var(--ac);border:1px solid var(--acl);text-decoration:none;vertical-align:1px}
.cite:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.refs{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.refs>b{display:flex;align-items:center;gap:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx2);margin-bottom:6px;font-weight:700}
.refs>b svg{width:13px;height:13px}
.ref{display:flex;gap:9px;align-items:baseline;padding:3px 0;font-size:12.5px;line-height:1.45}
.ref .rn{flex:none;font-weight:700;color:var(--ac);font-size:11px;min-width:22px}
.ref a{color:var(--tx);text-decoration:none;border-bottom:1px solid var(--line2)}
.ref a:hover{color:var(--ac);border-color:var(--acl)}
.ref .rmeta{display:block;color:var(--tx2);font-size:11.5px;margin-top:1px}
.srcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.srcs span,.srcs a{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--tx2)}
.srcs a{color:var(--ac);text-decoration:none;font-weight:600}.srcs a:hover{border-color:var(--acl);background:var(--acs)}
.sqsrc{display:flex;flex-wrap:wrap;gap:7px}
.sqc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);color:var(--tx2);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.sqc svg{width:14px;height:14px}.sqc:hover{border-color:var(--acl)}.sqc.on{background:var(--acs);border-color:var(--acl);color:var(--ac)}
.sqoa{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--tx2);cursor:pointer}.sqoa input{width:16px;height:16px}
.plan{margin-top:10px;border:1px solid var(--acl);background:var(--acs);border-radius:10px;padding:10px 12px}
.plan b{display:block;margin-bottom:6px}.plan .it{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--acl);font-size:13px}
.plan .it em{font-style:normal;font-weight:600;color:var(--ac)}.plan .it small{display:block;color:var(--tx2)}
.act{margin-top:10px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:10px 12px}
.act b{display:block;margin-bottom:6px}.act ul{margin:0 0 8px 16px;font-size:13px;color:var(--tx2)}
.starters{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px}
.starters button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--tx2)}
.starters button:hover{border-color:var(--ac);color:var(--ac)}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.composer .box{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line2);border-radius:12px;padding:6px 6px 6px 12px;background:var(--panel)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:24px;max-height:160px;padding:6px 0;outline:none}
.composer .tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--tx3)}
.mp{position:relative}
.mp .cur{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2);cursor:pointer;font-size:12.5px;font-weight:550;color:var(--tx)}
.mp .menu{position:absolute;bottom:38px;left:0;min-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:6px;z-index:20}
.mp .menu .sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);padding:6px 10px 2px;font-weight:600}
.mp .menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer}
.mp .menu button:hover{background:var(--muts)}.mp .menu button.on{background:var(--acs)}
.mp .menu button .d{font-size:11.5px;color:var(--tx3);display:block}
.mp .menu button .lock{margin-left:auto;font-size:11px;color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* EVENTS */
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ev{padding:16px;display:grid;gap:8px;cursor:pointer}
.ev:hover{box-shadow:var(--sh2)}
.ev h3{font-size:15px;letter-spacing:-.2px}.ev .when{color:var(--tx2);font-size:13px}
.ev .stats{display:flex;gap:12px;font-size:12px;color:var(--tx3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px;overflow:auto}
.tabs button{border:0;background:transparent;padding:11px 12px;font-weight:550;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{margin-top:4px;width:16px;height:16px;accent-color:var(--ok)}
.task .t{flex:1}.task .t b{font-weight:550}.task .t.done b{text-decoration:line-through;color:var(--tx3)}
.task .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.upd{padding:12px 0;border-top:1px solid var(--line)}.upd:first-child{border-top:0}
.upd h4{font-size:14px;display:flex;gap:8px;align-items:center}.upd p{color:var(--tx2);white-space:pre-wrap;margin-top:4px}
.upd .m{font-size:11.5px;color:var(--tx3);margin-top:4px}
.chatline{display:flex;gap:8px;padding:6px 0}.chatline .av{width:28px;height:28px;font-size:10px}
.chatline .b{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 11px;max-width:80%}
.chatline .b small{display:block;color:var(--tx3);font-size:11px}
.chatline.me{flex-direction:row-reverse}.chatline.me .b{background:var(--acs);border-color:var(--acl)}
.code-pill{font-family:ui-monospace,Menlo,monospace;background:var(--muts);padding:3px 8px;border-radius:7px;letter-spacing:1.5px;font-weight:700}
.rsvp{display:flex;gap:6px}.rsvp button.on{background:var(--oks);border-color:var(--ok);color:var(--ok)}
/* TABLES */
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}table.t th{color:var(--tx3);font-weight:600;font-size:12px}
/* MODAL + TOAST */

var ASKAI={id:"agent-askai",name:"Ask AI",title:"Any question - even beyond your class materials",description:"Ask about anything you are learning, including topics your teacher has not uploaded. For answers from your class materials, use the Tutor tab.",color:"#7c3aed",icon:"spark",placeholder:"Ask anything you are learning...",footnote:"General answers - check important facts with your teacher",starters:["Explain photosynthesis in simple words","How do I find the area of a triangle?","Give me tips to remember vocabulary","What caused World War I?"]};
// StudyPals lesson / quiz go through the Y Square backend, which sets the student id from the session and applies the guardrails.
function spTask(task,topic,extra,tries){if(tries==null)tries=1;
 var ctx=Object.assign({grade:String(spGrade()),subject:S.sp.subject,topic:topic},extra||{});
 return chatApi({agentId:"agent-studypals",task:task,message:topic,model:"studypals",conversationId:"sp-"+task,context:ctx}).then(function(j){
  if(j&&j.success&&j.data)return j.data;
  var e=(j&&j.error)||{};
  if(e.code==="BLOCKED"||e.code==="RATE_LIMITED"||e.code==="INVALID_REQUEST"||e.code==="INVALID_SESSION"||e.code==="NETWORK"||tries<=0)throw {code:e.code,message:friendlyMsg(e,"StudyPals could not finish that just now. Please try again in a moment.")};
  toast("Still working on it - one moment...");
  return new Promise(function(res){setTimeout(res,SP_RETRY_MS);}).then(function(){return spTask(task,topic,extra,tries-1);});
 });}

// quiz
function qObjective(q){if(typeof q.objective==="boolean")return q.objective;return ["multiple_choice","fill_blank","true_false"].indexOf(q.type)>=0;}
function qNorm(s){return String(s==null?"":s).toLowerCase().replace(/[.,;:!?'"`()\[\]{}]/g,"").replace(/\s+/g," ").trim();}
function qRight(q,ans){
 if(ans==null||!String(ans).trim())return false;
 var a=qNorm(ans),k=qNorm(q.answer);if(!k)return false;
 if(a===k||a.replace(/ /g,"")===k.replace(/ /g,""))return true;
 if(Array.isArray(q.options)){var idx=q.options.map(qNorm).indexOf(a);if(idx>=0){var letter="abcdefgh".charAt(idx);if(k===letter||k===String(idx+1)||k.indexOf(letter+" ")===0&&qNorm(k.slice(2))===a)return true;}}
 var na=Number(a.replace(/ /g,"")),nk=Number(k.replace(/ /g,""));if(a&&k&&isFinite(na)&&isFinite(nk)&&Math.abs(na-nk)<1e-9)return true;
 return false;
}
function qTotals(rec){var qs=(rec.quiz||{}).questions||[];var got=0,max=0,open=0;qs.forEach(function(q,i){var pts=Number(q.points)||1;if(qObjective(q)){max+=pts;if(qRight(q,rec.answers[i]))got+=pts;}else open++;});return {got:got,max:max,open:open};}

function quizHtml(rec){
 var Q=rec.quiz||{};var qs=Q.questions||[];var done=!!rec.submitted;
 var h='<div class="card"><div class="bd">';
 if(Q.groundedInMaterial===false)h+='<div class="note">'+ic("help")+' There is no class material for this topic in Grade '+esc(rec.grade)+' '+esc(rec.subject)+' yet, so StudyPals could not write real questions. Ask your teacher to upload it, or try another topic.</div>';

 if(done){var t=qTotals(rec);h+='<div class="score"><b>'+t.got+' / '+t.max+'</b><div><div style="font-weight:600">'+(t.max&&t.got===t.max?"Perfect score!":t.max&&t.got/t.max>=0.7?"Great work!":"Keep practising - you are getting there.")+'</div><div class="small muted">Marked automatically'+(t.open?'. Compare your '+t.open+' written answer'+(t.open===1?"":"s")+' with the rubric below.':'.')+'</div></div></div>';}
 h+='<form onsubmit="return A.submitQuiz()">'+qs.map(function(q,i){
  var ans=rec.answers[i];var obj=qObjective(q);var right=done&&obj?qRight(q,ans):null;
  var cls=done&&obj?(right?"ok":"bad"):"";
  var input;
  if(Array.isArray(q.options)&&q.options.length){input=q.options.map(function(o){var isAns=done&&qNorm(o)===qNorm(q.answer);return '<label class="opt'+(isAns?" right":"")+'"><input type="radio" name="q'+i+'" value="'+attr(o)+'"'+(String(ans)===String(o)?" checked":"")+(done?" disabled":"")+' onchange="A.qAns('+i+',this.value)"><span>'+esc(o)+'</span></label>';}).join("");}
  else if(!obj||q.type==="essay"||q.type==="short_answer"){input='<textarea placeholder="Write your answer" oninput="A.qAns('+i+',this.value)"'+(done?" disabled":"")+'>'+esc(ans||"")+'</textarea>';}
  else input='<input type="text" placeholder="Your answer" value="'+attr(ans||"")+'" oninput="A.qAns('+i+',this.value)"'+(done?" disabled":"")+'>';
  var fb="";
  if(done){
   if(obj)fb='<div class="fb">'+(right?'<b style="color:var(--ok)">'+ic("check")+' Correct</b>':'<b style="color:var(--err)">Not quite.</b><span>Correct answer: <b>'+esc(q.answer)+'</b></span>')+'</div>';
   else fb='<div class="fb"><b>How to check your answer</b><span class="muted">'+esc(q.rubric||"Compare with your class notes or ask the tutor.")+'</span></div>';
  }

var SYNC_MAP={sp:"studypals",lessons:"studypals",quizzes:"studypals",ask:"studypals",quizPref:"studypals",convs:"chats",model:"prefs"};
var SYNC_T={},SYNC_READY=false,LS_SET0=LS.set;
LS.set=function(k,v){LS_SET0(k,v);var ag=SYNC_MAP[k];if(ag)queueSync(ag);};
if(!LS.get("modelv",0)){if(S.model==="gemini")S.model="groq";LS_SET0("model",S.model);LS_SET0("modelv",1);}
function agentData(ag){
 if(ag==="studypals")return {sp:S.sp,lessons:S.lessons,quizzes:S.quizzes,ask:S.askLog,quizPref:LS.get("quizPref",null)};
 if(ag==="chats"){var c={};Object.keys(S.convs).forEach(function(k){var x=S.convs[k];if(x&&Array.isArray(x.messages)&&x.messages.length)c[k]={id:x.id,messages:x.messages.slice(-40)};});return {convs:c};}
 return {model:S.model};
}
function queueSync(ag){if(!SYNC_READY||!signedIn())return;clearTimeout(SYNC_T[ag]);SYNC_T[ag]=setTimeout(function(){pushState(ag);},1200);}
function pushState(ag){
 if(!SYNC_READY||!signedIn())return Promise.resolve();
 var data=agentData(ag);
 if(ag==="chats"){var keys=Object.keys(data.convs);while(JSON.stringify(data).length>350000&&keys.length){var k=keys.shift();data.convs[k].messages=data.convs[k].messages.slice(-10);if(JSON.stringify(data).length>350000)delete data.convs[k];}}
 if(ag==="studypals"){while(JSON.stringify(data).length>350000&&(data.lessons.length>1||data.quizzes.length>1)){if(data.lessons.length>1)data.lessons=data.lessons.slice(0,-1);if(data.quizzes.length>1)data.quizzes=data.quizzes.slice(0,-1);}}
 return api("state.save",{agent:ag,data:data}).then(function(){S.syncAt=Date.now();},function(){});
}
function lastAt(list){var t=0;(list||[]).forEach(function(m){var x=Number(m&&m.at)||(m&&m.at?new Date(m.at).getTime():0);if(x>t)t=x;});return t;}
function mergeById(a,b,max){var seen={},out=[];(a||[]).concat(b||[]).forEach(function(x){if(!x||typeof x!=="object")return;var k=String(x.id||x.at);if(seen[k]!=null){var i=seen[k];var y=out[i];if(x.submitted&&!y.submitted)out[i]=x;return;}seen[k]=out.length;out.push(x);});out.sort(function(p,q){return (Number(q.at)||0)-(Number(p.at)||0);});return out.slice(0,max);}
function mergeAsk(a,b){var seen={},out=[];(a||[]).concat(b||[]).forEach(function(x){if(!x)return;var k=x.at+"|"+x.role+"|"+String(x.content||"").slice(0,40);if(seen[k])return;seen[k]=1;out.push(x);});out.sort(function(p,q){return (Number(p.at)||0)-(Number(q.at)||0);});return out.slice(-30);}
function mergeConvs(a,b){var out={};[a||{},b||{}].forEach(function(src){Object.keys(src).forEach(function(k){var x=src[k];if(!x||!Array.isArray(x.messages))return;var y=out[k];if(!y||lastAt(x.messages)>lastAt(y.messages)||(lastAt(x.messages)===lastAt(y.messages)&&x.messages.length>y.messages.length))out[k]=x;});});return out;}
function resetAgentData(){SYNC_READY=false;S.syncedFor=null;S.sp={grade:"8",subject:"Math",topic:""};S.lessons=[];S.quizzes=[];S.askLog=[];S.convs={};S.lessonView=null;S.quizView=null;S.pdraft=null;["sp","lessons","quizzes","ask","convs","quizPref","pdraft","syncOwner"].forEach(function(k){LS.del(k);});}
function syncLoad(){
 var me=actor().id;var owner=LS.get("syncOwner",null);
 if(owner&&owner!==me){resetAgentData();S.syncedFor=me;}
 SYNC_READY=false;
 return api("state.get").then(function(d){
  var st=(d&&d.state)||{};var sp=st.studypals||{},ch=st.chats||{},pr=st.prefs||{};
  if(sp.sp&&typeof sp.sp==="object")S.sp=Object.assign({},S.sp,sp.sp,{topic:S.sp.topic||sp.sp.topic||""});
  S.lessons=mergeById(S.lessons,sp.lessons,8);S.quizzes=mergeById(S.quizzes,sp.quizzes,8);S.askLog=mergeAsk(S.askLog,sp.ask);
  if(sp.quizPref&&!LS.get("quizPref",null))LS_SET0("quizPref",sp.quizPref);
  S.convs=mergeConvs(ch.convs,S.convs);
  var ids=((S.boot||{}).models||[]).map(function(m){return m.id;});
  if(pr.model&&ids.indexOf(pr.model)>=0&&pr.model!=="gemini")S.model=pr.model;
  if(S.lessonView)S.lessonView=S.lessons.filter(function(x){return x.id===S.lessonView.id;})[0]||S.lessons[0]||null;else S.lessonView=S.lessons[0]||null;
  if(S.quizView)S.quizView=S.quizzes.filter(function(x){return x.id===S.quizView.id;})[0]||S.quizzes[0]||null;else S.quizView=S.quizzes[0]||null;
  LS_SET0("sp",S.sp);LS_SET0("lessons",S.lessons);LS_SET0("quizzes",S.quizzes);LS_SET0("ask",S.askLog);LS_SET0("convs",S.convs);LS_SET0("model",S.model);LS_SET0("syncOwner",me);
  SYNC_READY=true;
  var server={studypals:sp,chats:ch,prefs:pr};
  ["studypals","chats","prefs"].forEach(function(ag){var mine=agentData(ag),theirs=server[ag]||{};var norm=function(x){if(x==null)return null;if(Array.isArray(x)&&!x.length)return null;if(typeof x==="object"&&!Array.isArray(x)&&!Object.keys(x).length)return null;return JSON.stringify(x);};var same=Object.keys(mine).every(function(k){return norm(mine[k])===norm(theirs[k]);});if(!same)pushState(ag);});
  render();
 }).catch(function(){S.syncedFor=null;});
}

}
// ---- LaTeX clean-up for model answers (md() does not render TeX) ---------------------------------------------------
var TEXSYM={alpha:"α",beta:"β",gamma:"γ",delta:"δ",theta:"θ",pi:"π",phi:"φ",lambda:"λ",mu:"μ",sigma:"σ",omega:"ω",Delta:"Δ",Omega:"Ω",times:"×",cdot:"·",div:"÷",pm:"±",le:"≤",leq:"≤",ge:"≥",geq:"≥",ne:"≠",neq:"≠",approx:"≈",infty:"∞",circ:"°",degree:"°",rightarrow:"→",to:"→",Rightarrow:"⇒",quad:" ",qquad:" ",angle:"∠",triangle:"△",sqrt:"√"};
function texInline(x){var r=String(x);
 r=r.replace(/\\left|\\right/g,"").replace(/\\[,;:! ]/g," ");
 for(var i=0;i<3;i++)r=r.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,"($1)/($2)");
 r=r.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)").replace(/\\(?:text|mathrm|mathbf|operatorname)\s*\{([^{}]*)\}/g,"$1");
 r=r.replace(/\\([A-Za-z]+)/g,function(m,n){return Object.prototype.hasOwnProperty.call(TEXSYM,n)?TEXSYM[n]:n;});
 r=r.replace(/\^\{?\s*°\s*\}?/g,"°").replace(/\^\{([^{}]*)\}/g,"^($1)").replace(/_\{([^{}]*)\}/g,"_$1");
 return r.replace(/[{}]/g,"").replace(/[ \t]+/g," ").trim();}
function texClean(s){
 if(!/\\[\[\(]|\$\$|\\(d?frac|sin|cos|tan|cdot|times|sqrt|pi|theta|left|text)\b/.test(s))return s;
 return s.replace(/\\\[([\s\S]*?)\\\]/g,function(m,x){return "\n\n"+texInline(x)+"\n\n";})
  .replace(/\$\$([\s\S]*?)\$\$/g,function(m,x){return "\n\n"+texInline(x)+"\n\n";})
  .replace(/\\\(([\s\S]*?)\\\)/g,function(m,x){return texInline(x);});
}

function ctxFor(agentId){if(agentId==="agent-studypals"||agentId==="agent-askai")return {grade:S.sp.grade,subject:S.sp.subject,topic:S.sp.topic};if(agentId==="agent-events"&&S.event&&S.route.view==="events"&&S.route.id)return {eventId:S.event.event.id};return {};}
// ---- SynthIQ: evidence search across the sources the person picks ----------------------------------------------------
var SQ_SOURCES=[["pubmed","PubMed / MEDLINE","Peer-reviewed biomedical citations and abstracts"],["pmc","PubMed Central","Open-access full-text articles"],["cochrane","Cochrane Reviews","Systematic reviews of healthcare interventions"],["trials","ClinicalTrials.gov","Registered and ongoing clinical trials"],["preprints","Preprints (medRxiv, bioRxiv)","Posted early, not yet peer reviewed"],["crossref","Other journals (Crossref)","Wider literature beyond biomedicine"]];
var SQ_YEARS=[["any","Any year"],["5","Last 5 years"],["10","Last 10 years"]];
var SQ_TYPES=[["any","All study types"],["evidence","Reviews, meta-analyses and trials"]];
var SQ_PER=[["3","3 per source"],["5","5 per source"],["8","8 per source"]];
var SYNTHIQ={id:"agent-synthiq",name:"SynthIQ",title:"Evidence from the sources you choose",description:"Research companion for medical and health-science students. Searches PubMed, PubMed Central, Cochrane, ClinicalTrials.gov, preprints and more, then answers from what it finds and links every claim to the paper behind it.",color:"#0e7490",icon:"file",supportsModels:true,placeholder:"Ask a clinical or research question...",capabilities:["Cited answers","Pick your sources","Study design and limits","Evidence tables"],starters:["What is the evidence for tranexamic acid in major trauma?","Summarise recent trials of SGLT2 inhibitors in heart failure","D-dimer versus Wells score for diagnosing pulmonary embolism","What do systematic reviews say about vitamin D and respiratory infections?"]};
S.sq=LS.get("sq",{sources:["pubmed","pmc","cochrane"],years:"any",types:"any",oa:false,per:"5"});
if(!Array.isArray(S.sq.sources)||!S.sq.sources.length)S.sq.sources=["pubmed","pmc"];
function sqSave(){LS.set("sq",S.sq);}
function sqCtx(){return {sources:S.sq.sources,years:S.sq.years,types:S.sq.types,openAccess:S.sq.oa?1:0,perSource:S.sq.per};}
function sqBar(){
 var chips=SQ_SOURCES.map(function(x){var on=S.sq.sources.indexOf(x[0])>=0;return '<button type="button" class="sqc'+(on?" on":"")+'" title="'+attr(x[2])+'" onclick="A.sqSrc(\''+x[0]+'\')">'+ic(on?"check":"plus")+'<span>'+esc(x[1])+'</span></button>';}).join("");

  '<div class="sqnote small muted">'+ic("help")+' SynthIQ searches only the sources you switch on and cites what it finds. It is a study aid, not clinical advice.</div></div>';
}

 function sel(field,opts){return '<select onchange="A.sqSet(\''+field+'\',this.value)">'+opts.map(function(o){return '<option value="'+attr(o[0])+'"'+(String(S.sq[field])===o[0]?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select>';}

 '<div class="card"><div class="hd">'+ic("cog")+'<h3>Search filters</h3></div><div class="bd"><div class="grid2"><div class="f"><label>Published</label>'+sel("years",SQ_YEARS)+'</div><div class="f"><label>Study types</label>'+sel("types",SQ_TYPES)+'</div></div><div class="f"><label>Results</label>'+sel("per",SQ_PER)+'</div><label class="sqoa"><input type="checkbox"'+(S.sq.oa?" checked":"")+' onchange="A.sqSet(\'oa\',this.checked)"><span>Free full text only</span></label></div></div>'+

// ---- phones: slide-in drawer, swipe between views, keyboard-aware chat (never runs on a laptop) ---------------------
var PHONE=function(){try{return matchMedia("(max-width:760px)").matches;}catch(e){return false;}};
A.drawer=function(on){try{document.body.classList.toggle("dopen",!!on);}catch(e){}};
(function(){
 var TAB=["","athlete","studypals","synthiq","events"];
 var sx=0,sy=0,edge=false,tracking=false;
 document.addEventListener("touchstart",function(e){
  if(!PHONE()||!e.touches||e.touches.length!==1){tracking=false;return;}
  var t=e.touches[0];sx=t.clientX;sy=t.clientY;tracking=true;
  edge=sx<=26&&!document.body.classList.contains("dopen");
 },{passive:true});
 document.addEventListener("touchend",function(e){
  if(!tracking||!PHONE())return;tracking=false;
  var t=(e.changedTouches||[])[0];if(!t)return;
  var dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6)return;
  if(document.body.classList.contains("dopen")){if(dx<0)A.drawer(false);return;}
  if(edge&&dx>0){A.drawer(true);return;}
  // leave anything that scrolls sideways alone (source chips, tabs, tables, model picker)
  if(e.target&&e.target.closest&&e.target.closest(".sqsrc,.apchips,.apform,.tabs,table,.srcs,.mp,.composer,input,textarea,select"))return;
  var v=S.route.view;var i=TAB.indexOf(v==="home"?"":v);
  if(i<0)return;
  var j=dx<0?i+1:i-1;
  if(j<0||j>=TAB.length)return;
  go("#/"+TAB[j]);
 },{passive:true});
 var vv=window.visualViewport;
 if(vv){
  var kb=function(){
   if(!PHONE()){document.documentElement.style.setProperty("--kb","0px");return;}
   var h=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
   document.documentElement.style.setProperty("--kb",h+"px");
   var ms=document.querySelector(".msgs");if(ms&&h>0)ms.scrollTop=ms.scrollHeight;
  };
  vv.addEventListener("resize",kb);vv.addEventListener("scroll",kb);
 }
})();
