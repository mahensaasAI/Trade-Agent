# Production server block for ysquareai.com on the GCP VM that already serves n8n.
#
# Install:
#   sudo cp ysquareai.com.conf /etc/nginx/sites-available/ysquareai.com
#   sudo ln -s /etc/nginx/sites-available/ysquareai.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check the upstream below against the existing duckdns block before installing:
#   sudo nginx -T | grep -n 'server_name\|proxy_pass'
#
# TLS is added by certbot, which rewrites this file in place. Install it as plain
# HTTP first, run certbot, and it will add the 443 block and the redirect.

upstream ysquare_n8n {
    server 127.0.0.1:5678;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ysquareai.com www.ysquareai.com;

    # Let certbot renew without the catch-all 404 below swallowing the challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    access_log /var/log/nginx/ysquareai.access.log;
    error_log  /var/log/nginx/ysquareai.error.log;

    # The page is ~200 KB of HTML; gzip takes it to roughly a quarter of that.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/html text/plain text/css application/json application/javascript;

    # StudyPals material uploads post the file body straight through.
    client_max_body_size 25m;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Sent to n8n on every proxied request. The UI workflow's Pick Page node reads
    # X-Forwarded-Host (falling back to Host) to decide which ys_ui_pages row to serve,
    # so these two headers are what make ysquareai.com the production hostname.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Agent replies wait on an upstream model, so allow a long read.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # The app itself. It is a hash router, so every screen is served from /.
    location = / {
        proxy_pass http://ysquare_n8n/webhook/Y2Workplace;
    }

    # Services API, agent chat and SynthIQ: /svc/api, /svc/chat, /svc/synthiq.
    location /svc/ {
        proxy_pass http://ysquare_n8n/webhook/Y2Workplace/svc/;
    }

    # StudyPals tutor, library and uploads. The page derives this base from its own
    # origin, so at the site root it calls https://ysquareai.com/studypals/...
    location /studypals/ {
        proxy_pass http://ysquare_n8n/webhook/studypals/;
    }

    # Stripe posts here with its key in the query string.
    location = /billing/stripe {
        proxy_pass http://ysquare_n8n/webhook/Y2Workplace/billing/stripe;
    }

    location = /favicon.ico { access_log off; return 204; }
    location = /robots.txt  { add_header Content-Type text/plain; return 200 "User-agent: *\nAllow: /\n"; }

    # Everything else, including the n8n editor and its /rest API, is not part of
    # the product and must not be reachable on the production hostname.
    location / {
        return 404;
    }
}
